plugins {
    id 'com.android.application'
}

android {
    namespace 'com.baekhak.centralcontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.navigator.freedom.v3final'
        minSdk 23
        targetSdk 35
        versionCode 40047
        versionName "4.0.47-EMERGENCY-COMPACT-20"
    }

    buildFeatures {
        buildConfig true
    }

    // 배포 APK의 서명키를 빌드마다 바꾸지 않도록 CI 보관키를 명시적으로 사용
    signingConfigs {
        distribution {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.distribution
            debuggable false
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            res.srcDirs = ['src/main/res', 'src/freedom/res']
            assets.srcDirs = ['src/main/assets', 'src/freedom/assets']
        }
        debug {
            manifest.srcFile 'src/freedom/AndroidManifest.xml'
        }
        release {
            manifest.srcFile 'src/freedom/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "HANGHAE_FREEDOM_V4_0_47_COMPACT_TEST_CANDIDATE.apk"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
