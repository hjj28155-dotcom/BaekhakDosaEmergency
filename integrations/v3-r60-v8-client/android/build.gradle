plugins { id 'com.android.library' version '8.7.3' }
android {
    namespace 'kr.hanghae.v3v8'
    compileSdk 35
    defaultConfig { minSdk 23; consumerProguardFiles 'consumer-rules.pro' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
