plugins { id 'com.android.application' }
android {
    namespace 'kr.hanghae.crewmeeting'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.hanghae.crewmeeting.compact'
        minSdk 24
        targetSdk 34
        versionCode 125
        versionName '1.0.25-CAPTAIN-TOTAL-CUMULATIVE-SCORES'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { debug { minifyEnabled false; signingConfig signingConfigs.debug }; release { minifyEnabled false } }
}
