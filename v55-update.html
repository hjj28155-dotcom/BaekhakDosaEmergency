</style></head><body><main class="wrap"><h1>항행의자유 V5.5 업데이트</h1><div id="status" class="status" role="status">배포 상태 확인 중…</div><ul class="info" hidden id="details"><li id="version"></li><li id="size"></li></ul><a id="download" hidden>APK 다운로드 · 업데이트</a><button id="refresh" type="button">배포 상태 다시 확인</button><p class="small">기존 앱은 삭제하지 마세요. APK 다운로드 후 알림을 눌러 안드로이드 설치 화면에서 확인하세요.</p></main><script>
(function(){'use strict';const expectedPackage='com.navigator.analysis.v5',expectedSigner='3fe57967c15f81ee39ea2b9b88dd96a7506c1b5b9032606ecbea04bbdb15ee3c';const status=document.getElementById('status'),link=document.getElementById('download'),details=document.getElementById('details');
async function load(){link.hidden=true;link.removeAttribute('href');details.hidden=true;status.textContent='배포 상태 확인 중…';try{const response=await fetch('v55-latest.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('배포 정보 조회 실패');const m=await response.json();if(m.packageName!==expectedPackage||m.requiredSignerSha256!==expectedSigner)throw Error('V5.5 배포 정보가 일치하지 않습니다.');if(m.status!=='ready'){status.textContent=m.message||'새 APK가 아직 등록되지 않았습니다.';return}if(!Number.isInteger(m.versionCode)||m.versionCode<=55000||!Number.isInteger(m.apkSizeBytes)||m.apkSizeBytes<1000||!/^[a-f0-9]{64}$/.test(m.apkSha256||''))throw Error('확인되지 않은 APK 배포 정보입니다.');const url=new URL(m.apkUrl,location.href);if(url.protocol!=='https:'||!['hjj28155-dotcom.github.io','raw.githubusercontent.com','github.com'].includes(url.hostname)||!url.pathname.startsWith(url.hostname==='raw.githubusercontent.com'?'/hjj28155-dotcom/BaekhakDosaEmergency/':url.hostname==='github.com'?'/hjj28155-dotcom/BaekhakDosaEmergency/':'/BaekhakDosaEmergency/'))throw Error('APK 주소가 일치하지 않습니다.');const apk=await fetch(url.href,{method:'HEAD',cache:'no-store'});if(!apk.ok)throw Error('APK 파일이 아직 배포되지 않았습니다.');if(Number(apk.headers.get('Content-Length'))!==m.apkSizeBytes)throw Error('APK 파일 크기 확인 실패');document.getElementById('version').textContent='버전 '+m.versionName;document.getElementById('size').textContent=(m.apkSizeBytes/1048576).toFixed(1)+' MB';details.hidden=false;link.href=url.href;link.hidden=false;status.textContent='새 APK를 다운로드할 수 있습니다.'}catch(e){status.textContent=e.message||'배포 상태를 확인하지 못했습니다.'}}
document.getElementById('refresh').addEventListener('click',load);load();})();
