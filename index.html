<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>항행의자유 설치</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#03182c,#00101f);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 16px 50px;text-align:center}h1{color:#ffe39a;margin:0 0 10px}.sub{color:#c5d8e7;line-height:1.6}.card{margin-top:18px;padding:18px;background:#08253c;border:1px solid #315d78;border-radius:18px}.btn{display:block;width:100%;padding:18px;margin-top:14px;border:1px solid #e3c56a;border-radius:15px;background:linear-gradient(#8a6718,#493407);color:#fff3b0;font-size:19px;font-weight:900;text-decoration:none}video{display:block;width:100%;margin-top:14px;border-radius:14px;background:#000}.status{margin-top:12px;color:#8fe8ff;font-weight:800;line-height:1.55}.install{display:none}.note{margin-top:12px;color:#b8cbd8;font-size:14px;line-height:1.6}
</style></head><body>
<div class="wrap"><h1>항행의자유</h1><div class="sub">설치동영상과 안내음악을 확인한 뒤 최신판을 설치합니다.</div>
<div class="card">
<button id="start" class="btn" type="button">▶ 설치동영상 재생</button>
<video id="video" playsinline preload="auto" controls><source src="freedom_guide_latest.mp4?v=20261004-clean1" type="video/mp4"></video>
<audio id="audio" preload="auto" src="kimkwangseok_ileona.mp3?v=20261004-clean1"></audio>
<div id="status" class="status">위 재생 버튼을 누르세요.</div>
<a id="install" class="btn install" href="https://jyqkohpeowkhuaohlezc.supabase.co/functions/v1/latest-apk">최신 항행의자유 V4.0.30 업데이트 설치</a>
<div class="note">기존 앱은 삭제하지 마십시오. 영상의 재생바를 끝까지 이동해도 설치 단계로 넘어갑니다.</div>
</div></div>
<script>
const v=document.getElementById('video'),a=document.getElementById('audio'),start=document.getElementById('start'),install=document.getElementById('install'),status=document.getElementById('status');
let finished=false;
function sync(force=false){if(!a)return;try{const t=v.currentTime||0;if(force||Math.abs((a.currentTime||0)-t)>.20)a.currentTime=t;}catch(e){}}
async function audioPlay(){if(!a)return;try{a.muted=false;a.volume=1;sync(true);await a.play();}catch(e){}}
async function begin(){
 finished=false;install.style.display='none';start.style.display='none';
 try{v.currentTime=0;}catch(e){} try{a.currentTime=0;}catch(e){}
 v.muted=true;
 await audioPlay();
 try{await v.play();status.textContent='🔊 설치동영상과 안내음악 동기 재생 중';}catch(e){status.textContent='영상 화면의 ▶ 버튼을 눌러주세요.';}
}
function finish(){
 if(finished)return;finished=true;
 try{v.pause();}catch(e){}try{a.pause();}catch(e){}
 start.style.display='none';install.style.display='block';status.textContent='✅ 설치동영상 종료 · 아래 최신 업데이트 설치 버튼을 누르세요.';
 setTimeout(()=>install.scrollIntoView({behavior:'smooth',block:'center'}),80);
}
start.addEventListener('click',begin);
v.addEventListener('play',()=>{if(!finished)audioPlay();});
v.addEventListener('pause',()=>{if(!finished)try{a.pause();}catch(e){}});
v.addEventListener('seeking',()=>{try{a.pause();}catch(e){}sync(true);});
v.addEventListener('seeked',()=>{sync(true);if(Number.isFinite(v.duration)&&v.duration>0&&v.currentTime>=v.duration-.75){finish();return;}if(!v.paused)audioPlay();});
v.addEventListener('timeupdate',()=>{if(finished)return;sync(false);if(Number.isFinite(v.duration)&&v.duration>0&&v.currentTime>=v.duration-.40)finish();});
v.addEventListener('ended',finish);
</script></body></html>
