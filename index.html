<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>항행의자유 V4.0.17 EXACT MP3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#03182c,#00101f);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 52px;text-align:center}
h1{margin:0 0 8px;color:#ffe39a;font-size:30px}
.sub{color:#c5d8e7;line-height:1.65;margin-bottom:18px}
.card{background:#08253c;border:1px solid #315d78;border-radius:18px;padding:18px;text-align:left;box-shadow:0 10px 28px #0007}
.step{padding:10px 12px;border-bottom:1px solid #25465c;font-size:16px}
.step:last-child{border-bottom:0}
.step b{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:9px;border-radius:50%;background:#0c6091;color:#fff3b0}
.btn{display:block;width:100%;margin:20px auto 0;padding:17px;border:1px solid #e3c56a;border-radius:15px;background:linear-gradient(#8a6718,#493407);color:#fff3b0;font-size:19px;font-weight:900;text-decoration:none}
.note{margin-top:12px;color:#9fb8c9;font-size:13px;line-height:1.6}
.ok{margin-top:15px;color:#7ff0bc;font-weight:800}

.guideWrap{margin:18px 0 16px;padding:12px;background:#031523;border:1px solid #315d78;border-radius:18px}
.guideTitle{font-size:20px;font-weight:900;color:#ffe39a;margin:2px 0 10px}
.guideVideo{display:block;width:100%;max-height:70vh;border-radius:14px;background:#000}
.autoNote{margin-top:10px;color:#8fe8ff;font-weight:800;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>항행의자유</h1>
<div class="sub">최종 배포판 V4.0.17 EXACT MP3<br>처음 설치하시는 분은 아래 설치 동영상을 먼저 보세요.</div>
<div class="guideWrap">
  <div class="guideTitle">▶ 설치 동영상</div>
  <button id="guideStartBtn" class="btn" type="button" style="margin-top:0" onclick="startGuideWithSound()">🔊 소리 켜고 설치영상 재생</button>
  <video id="installGuideVideo" class="guideVideo" controls playsinline preload="auto" style="margin-top:12px">
    <source src="freedom_guide_latest.mp4?v=20261001-2117" type="video/mp4">
    설치 동영상을 재생할 수 없습니다.
  </video>
  <div id="guideStatus" class="autoNote">먼저 위 버튼을 눌러 설치 동영상을 소리와 함께 끝까지 보세요.</div>
</div>
<div class="card">
<div class="step"><b>1</b>링크 클릭</div>
<div class="step"><b>2</b>최종 APK 다운로드</div>
<div class="step"><b>3</b>환영 두루마리 화면 + 승인요청 창 동시 표시</div>
<div class="step"><b>4</b>항해사 승인완료</div>
<div class="step"><b>5</b>두루마리 확인 후 다음 진행</div>
<div class="step"><b>6</b>설치동영상 재생</div>
<div class="step"><b>7</b>안내동영상 재생</div>
<div class="step"><b>8</b>홈화면 실행</div>
</div>
<button id="downloadBtn" class="btn" type="button" disabled style="opacity:.45" onclick="downloadLatestApk()">설치영상 시청 후 APK 다운로드</button>
<div class="ok">배포 파일: FREEDOM_V4_0_17_EXACT_MP3-debug.apk</div>
<div class="note">설치영상이 끝나면 APK 다운로드 버튼이 자동으로 열립니다.</div>
</div>
<script>
let GUIDE_DONE=false;

function startGuideWithSound(){
  const v=document.getElementById('installGuideVideo');
  const b=document.getElementById('guideStartBtn');
  const st=document.getElementById('guideStatus');
  if(!v)return;
  v.muted=false;
  v.volume=1;
  v.currentTime=0;
  const p=v.play();
  if(p&&typeof p.then==='function'){
    p.then(()=>{
      if(b){b.disabled=true;b.style.opacity='.65';b.textContent='▶ 설치영상 재생 중';}
      if(st)st.textContent='설치 동영상을 끝까지 시청해 주세요.';
    }).catch(()=>{
      if(st)st.textContent='영상 재생이 차단되었습니다. 버튼을 다시 눌러 주세요.';
    });
  }
}

function unlockDownload(){
  GUIDE_DONE=true;
  const b=document.getElementById('downloadBtn');
  const st=document.getElementById('guideStatus');
  if(b){b.disabled=false;b.style.opacity='1';b.textContent='APK 다운로드 시작';}
  if(st)st.textContent='✅ 설치영상 시청 완료 · 이제 APK를 받을 수 있습니다.';
}

function downloadLatestApk(){
  if(!GUIDE_DONE)return;
  location.href='https://drive.usercontent.google.com/download?id=1eOhPO1mYbRGFCI1ffpT1e5Tioo4QApgw&export=download&confirm=t';
}

window.addEventListener('load',()=>{
  const v=document.getElementById('installGuideVideo');
  if(v)v.addEventListener('ended',unlockDownload);
});
</script>
</body>
</html>
