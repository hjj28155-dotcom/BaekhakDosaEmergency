<script>
const v=document.getElementById('video');
const a=null;
const install=document.getElementById('install');const scrollStage=document.getElementById('scrollStage');
const status=document.getElementById('status');
let finished=false;
function sync(force=false){if(!a)return;try{const t=v.currentTime||0;if(force||Math.abs((a.currentTime||0)-t)>.20)a.currentTime=t;}catch(e){}}
async function playAudio(){return;}
function finish(){if(finished)return;finished=true;try{v.pause();}catch(e){}if(scrollStage)scrollStage.style.display='block';status.textContent='✅ 설치동영상 종료 · 환영 두루마리를 확인한 뒤 다음 단계로 진행하세요.';setTimeout(()=>scrollStage.scrollIntoView({behavior:'smooth',block:'start'}),80);}
v.controls=true;
v.addEventListener('play',()=>{finished=false;if(scrollStage)scrollStage.style.display='none';playAudio();});
v.addEventListener('pause',()=>{if(!finished)});
v.addEventListener('seeking',()=>{sync(true);});
v.addEventListener('seeked',()=>{sync(true);if(Number.isFinite(v.duration)&&v.duration>0&&v.currentTime>=v.duration-.75){finish();return;}if(!v.paused)playAudio();});
v.addEventListener('timeupdate',()=>{if(finished)return;sync(false);if(Number.isFinite(v.duration)&&v.duration>0&&v.currentTime>=v.duration-.40)finish();});
v.addEventListener('ended',finish);
