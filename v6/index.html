<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>항행의자유 V6 · 중앙통제실</title>
<style>
:root{--bg:#06172c;--deep:#061d33;--panel:#0b2945;--tile:#14365a;--line:#345579;--gold:#f6d390;--fg:#edf6ff;--blue:#087bf1;--sub:#b5cee2}
*{box-sizing:border-box}body{background:linear-gradient(120deg,#071327,#153f6b);color:var(--fg);margin:0;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
body[data-theme="night"]{--bg:#010914;--deep:#091021;--panel:#101a33;--tile:#1c294a;--blue:#3758db;--line:#364568}
body[data-theme="sunrise"]{--bg:#281d31;--deep:#31233b;--panel:#423049;--tile:#49374b;--blue:#de8261;--line:#745365}
body[data-theme="sunset"]{--bg:#23192c;--deep:#312438;--panel:#453148;--tile:#583847;--blue:#c65674;--line:#734865}
body[data-theme="snow"]{--bg:#1c324a;--deep:#28445c;--panel:#285270;--tile:#326080;--blue:#5399d8;--line:#78a9be}
#phone{max-width:510px;min-height:100vh;margin:0 auto;background:var(--bg);box-shadow:0 0 60px #0008;position:relative}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--fg);border:1px solid var(--line);background:var(--tile);border-radius:9px;padding:10px}
button:disabled{opacity:.48;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}
header.top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#031125}
header.top button{font-size:20px;border:0;background:none;padding:4px 8px}
header.top .vtitle{text-align:center;font-size:15px;font-weight:800;color:var(--gold)}
header.top .vtitle small{display:block;font-size:11px;color:#b5d0e5;font-weight:500}
#quicknav{position:sticky;top:0;z-index:15;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px 11px;background:#07182ef6;border-bottom:1px solid var(--line)}
#quicknav button{min-height:43px;padding:8px 3px;font-size:13px;font-weight:800;white-space:nowrap;background:#16466b;border:1px solid #3d8dc2;border-radius:9px}
#quicknav button:disabled{opacity:.4}
#quicknav button:last-child{background:#16424d;border-color:#51afa2}
#page{padding:13px 14px 40px;min-height:calc(100vh - 62px)}
.hero{height:215px;border-radius:13px;background:radial-gradient(ellipse at 50% 100%,#5878b3 0%,#1c3e76 23%,#09234b 63%,#09152f 100%);border:1px solid #3c587b;position:relative;overflow:hidden;text-align:center}
.hero:before{content:"✦     ·        ✦         ✧";position:absolute;left:8px;right:8px;top:15px;opacity:.6;letter-spacing:10px;color:#d9ecff}
.hero .logo{position:relative;z-index:2;font-size:25px;font-weight:900;padding-top:25px;text-shadow:0 2px 9px #021428}
.hero small{position:relative;z-index:2;display:block;font-size:11px;color:#e4d8b1}
.hero .sea{position:absolute;bottom:-50px;left:-18px;right:-18px;height:112px;transform:rotate(-4deg);background:repeating-linear-gradient(178deg,#042949 0px,#14437b 3px,#0a2850 7px,#152f65 11px);border-radius:50%}
.hero .lighthouse{position:absolute;bottom:27px;left:46%;font-size:67px;z-index:1;filter:drop-shadow(0 4px 8px #071329)}
.roomgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.roomgrid button{min-height:82px;background:linear-gradient(140deg,#12476e,#122c51);border:1.5px solid #368fde;font-size:15px;font-weight:900}
.roomgrid button .icon{display:block;font-size:25px}
.roomgrid button:nth-child(2){border-color:#f04852}
.roomgrid button:nth-child(3){border-color:#21bf83}
.roomgrid button:nth-child(4){border-color:#e8aa41}
.roomgrid button:nth-child(5){border-color:#9e6af1}
.roomgrid button:nth-child(6){border-color:#08c9eb}
.extra{margin-top:15px}.extra h3{font-size:12px;color:var(--gold)}
.extragrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.footnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}
.footnav button{padding:11px 3px;font-size:12px;font-weight:750}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:15px 0 8px;color:var(--gold)}
.hint{color:var(--sub);font-size:12px;margin:7px 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin:11px 0}
.rows{display:flex;align-items:center;justify-content:space-between;gap:9px}
.rows>*{min-width:0}.rows h3{font-size:14px;margin:0}.rows p{margin:1px 0}
.small{font-size:11px;color:var(--sub);word-break:break-word}
.rowitem{padding:11px 3px;border-bottom:1px solid var(--line)}
.rowitem:last-child{border-bottom:0}
label{display:block;color:#c7e1f0;font-size:12px;font-weight:800;margin:12px 0 5px}
input,textarea,select{width:100%;background:#081d34;border:1px solid #557f9d;color:white;border-radius:9px;padding:12px}
textarea{min-height:104px;resize:vertical}input[type=file]{font-size:12px;padding:11px}
.primary{background:var(--blue);border-color:#8dc0ff;color:#fff;font-weight:850;width:100%;margin-top:12px;min-height:46px}
.mini{padding:7px 9px;font-size:12px;flex-shrink:0}.muted{color:var(--sub)}
.tabs{display:flex;gap:7px;margin-bottom:10px;overflow-x:auto}.tabs button{white-space:nowrap;padding:9px 13px}
.active{background:var(--blue)!important;border-color:#8dc0ff!important}
.folder{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;margin:8px 0;background:#0e3357}
.folder b{font-size:14px}
#status{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);max-width:480px;width:calc(100% - 24px);z-index:20;pointer-events:none;background:#102d43ed;color:#fff2c4;border:1px solid #5e8ba8;padding:8px 12px;border-radius:11px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;display:none}
#side{position:fixed;z-index:30;inset:0;background:#0009;display:none}
#side .drawer{background:#091a31;max-width:335px;width:83%;height:100%;padding:17px;overflow-y:auto}
#side .drawer button{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid #24445d;border-radius:0;padding:12px;background:transparent}
#side.show{display:block}
.previewimg{width:100%;max-height:50vh;object-fit:contain}.badge{background:#293e56;border:1px solid #71889f;padding:3px 7px;border-radius:6px;font-size:10px}
.serveronly{color:#eccb93;font-size:11px;line-height:1.6}

/* V6.0.8: one-glance home — preserve six-room order and the naval colors. */
.home-screen .hero{height:120px}
.home-screen .hero:before{top:5px}
.home-screen .hero .logo{font-size:20px;padding-top:10px}
.home-screen .hero .lighthouse{font-size:44px;bottom:11px;left:46%}
.home-screen .hero .sea{height:62px;bottom:-24px}
.home-screen .roomgrid{gap:7px;margin-top:8px}
.home-screen .roomgrid button,.home-screen .home-actions button{
 height:64px;min-height:64px;max-height:64px;
 padding:5px 4px;line-height:1.2;font-size:13px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
 overflow-wrap:anywhere;
}
.home-screen .roomgrid button .icon,.home-screen .home-actions .action-icon{font-size:20px;line-height:23px}
.home-screen .home-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}
.home-screen .home-actions button{border-color:#ebca83;background:linear-gradient(135deg,#173e62,#173551);font-weight:800}
.home-screen .footnav{margin-top:8px;gap:7px}
.home-screen .footnav button{height:43px;min-height:43px;max-height:43px;padding:3px;font-size:12px}
.home-screen .home-exit{margin-top:8px;min-height:42px;height:42px;max-height:42px;font-size:13px;padding:4px}
.home-screen .home-hint{font-size:10px;text-align:center;margin:5px 0 0}
@media(max-width:360px){
 .home-screen .roomgrid button,.home-screen .home-actions button{font-size:12px}
 .home-screen .footnav button{font-size:11px}
}

</style></head>

<script>
(function(){
'use strict';
var SERVICE='https://jyqkohpeowkhuaohlezc.supabase.co/functions/v1/v6-room-library-sync';
var PAIR='https://jyqkohpeowkhuaohlezc.supabase.co/functions/v1/v4-room-sync/pair';
var TOKEN='hanghae_v6_device_token_v1',THEME='hanghae_v6_theme';
var DEFAULT=[['all','전체방'],['analysis','1번방'],['controller','2번방'],['helmsman','3번방'],['freedom','4번방'],['chief','5번방']];
var rooms=DEFAULT.map(function(r){return {room_key:r[0],display_name:r[1],fixed:true}});
var active='analysis',screen='home',tab='files',filterRoom='',busy=false,pairingNow=false,noticeRoom='all',historyStack=[],releaseInfo=null;
var CURRENT_VERSION_CODE=600010, CURRENT_VERSION_NAME='V6.0.9 화면';
var ROUND_DOCS=[{"round_no":1246,"room_key":"all","title":"1246회차 백학도사 로또비법서 (신서)","source_author":"백학도사","source_text":"백학도사님의 이번회차 로또비법서 입니다\n\n1246 회차 로또비법서\n\n첫번째.대장장이의 망치가 녹이 슬었을때 알수가 있는 징표로구나.\n\n두번째. 개구리는 우물밖으로 나와 검은하늘을 바라보리로다.\n\n세번째. 흰 바둑알과 검은 바둑알의 위치가 바뀌며 승리의 뒤에 숨는구나.\n\n네번째. 종이학 천마리중 한마리만이 불에 타는구나.\n\n다섯째. 나룻배는 안개속에 흘러가며 종소리 나는 쪽으로 항하여 도착하리로다.\n\n여섯째. 돌위에 더 큰돌을 얹어서 탑을 만드리니 소원이 이루어질것이니로다.","status":"UNINTERPRETED","purchase_status":"REFERENCE_ONLY"}];
var UPDATE_SERVICE='https://jyqkohpeowkhuaohlezc.supabase.co/functions/v1/v6-update-check';
var currentFiles=[],currentPurchase=[],currentNotices=[],currentChats=[],currentDistribution=null,legacyOffset=0,legacyItems=[],selectedSinseo=1246,workingRound=1246;
var V6_ANALYSIS_NOTE_PREFIX='hanghae_v6_round_analysis_note_';
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function token(){try{return localStorage.getItem(TOKEN)||''}catch(e){return ''}}
function setToken(s){
 if(!/^[a-f0-9]{64}$/.test(String(s||'')))throw Error('서버가 유효한 기기 토큰을 반환하지 않았습니다.');
 try{
  localStorage.setItem(TOKEN,s);
  if(localStorage.getItem(TOKEN)!==s)throw Error('저장 후 검증 실패');
  return true;
 }catch(e){throw Error('기기 토큰 저장 실패: 앱 저장 공간을 확인하세요.')}
}
function theme(){try{return localStorage.getItem(THEME)||'sea'}catch(e){return 'sea'}}
function alertMsg(s){var n=el('status');n.textContent=s;n.style.display='block';clearTimeout(alertMsg.timer);alertMsg.timer=setTimeout(function(){n.style.display='none'},8000)}
function title(id){var r=rooms.find(function(x){return x.room_key===id});return r?r.display_name:id}
function validApkUrl(url){try{var u=new URL(String(url||''));return u.protocol==='https:'&&u.hostname==='raw.githubusercontent.com'&&u.pathname==='/hjj28155-dotcom/BaekhakDosaEmergency/main/V6_CENTRAL_CONTROL_20261016.apk'}catch(e){return false}}

var V6_PREF_KEY="hanghae_v6_local_room_settings_v1";
function cleanTitle(s){return String(s==null?"":s).trim().replace(/\s+/g," ")}
function validTitle(s){var n=cleanTitle(s);return n.length>0&&n.length<=32&&!/[<>\u0000-\u001f]/.test(n)}
function isOriginalLink(s){
 try{
  var u=new URL(String(s||"").trim());
  return u.protocol==="https:"&&["chatgpt.com","chat.openai.com"].includes(u.hostname)
   &&!u.username&&!u.password&&/^(?:\/g\/[a-z0-9_-]+)?\/c\/[a-z0-9-]+\/?$/i.test(u.pathname);
 }catch(e){return false}
}
function getPrefs(){
 var p={names:{},links:{},extras:[]};
 try{
  var raw=JSON.parse(localStorage.getItem(V6_PREF_KEY)||"null");
  if(raw&&typeof raw==="object"){
   if(raw.names&&typeof raw.names==="object")Object.keys(raw.names).forEach(function(k){if(validTitle(raw.names[k]))p.names[k]=cleanTitle(raw.names[k])});
   if(raw.links&&typeof raw.links==="object")Object.keys(raw.links).forEach(function(k){if(isOriginalLink(raw.links[k]))p.links[k]=raw.links[k]});
   if(Array.isArray(raw.extras))p.extras=raw.extras.filter(function(x){return x&&/^extra_[a-z0-9_-]{8,54}$/.test(String(x.room_key||""))&&validTitle(x.display_name)}).slice(0,94);
  }
 }catch(e){}
 return p;
}
var prefs=getPrefs();
function persistPrefs(){try{localStorage.setItem(V6_PREF_KEY,JSON.stringify(prefs));return true}catch(e){return false}}
function mergeRooms(server){
 var all=DEFAULT.map(function(x,i){return {room_key:x[0],display_name:x[1],fixed:true,sort_index:i}});
 var seen={};all.forEach(function(x){seen[x.room_key]=true});
 (Array.isArray(server)?server:[]).forEach(function(r){
  if(!r||typeof r.room_key!=="string")return;
  if(seen[r.room_key]){
   var found=all.find(function(x){return x.room_key===r.room_key});
   if(found&&validTitle(r.display_name))found.display_name=r.display_name;
  }else if(/^extra_[a-z0-9_-]{8,54}$/.test(r.room_key)){
   all.push({room_key:r.room_key,display_name:r.display_name,fixed:false,sort_index:all.length});
   seen[r.room_key]=true;
  }
 });
 prefs.extras.forEach(function(r){if(!seen[r.room_key]){
  all.push({room_key:r.room_key,display_name:r.display_name,fixed:false,pendingServer:!!r.pendingServer,sort_index:all.length});
  seen[r.room_key]=true;
 }});
 all.forEach(function(r){if(validTitle(prefs.names[r.room_key]))r.display_name=prefs.names[r.room_key]});
 return all;
}
rooms=mergeRooms(null);

function currentRound(){return Number((el('roundNumber')&&el('roundNumber').value)||1246)}
function hold(){return !!(token()&&/^[a-f0-9]{64}$/.test(token()))}
async function api(path,options){
 if(!hold())throw Error('기기 등록을 먼저 완료하십시오. 설정 → 기기 연결');
 var opt=options||{},headers={Authorization:'Bearer '+token()};
 if(opt.json){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.json)}
 var r=await fetch(SERVICE+path,{method:opt.method||'GET',headers:headers,body:opt.body,cache:'no-store'});
 var j={};try{j=await r.json()}catch(e){}
 if(!r.ok||j.error)throw Error((j.error||'연결 실패')+(j.message?' · '+j.message:''));
 return j;
}
function display(s){el('page').innerHTML=s;el('headTitle').innerHTML='⚓ 항행의자유 V6<small>'+esc(screen==='home'?'중앙통제실':screen==='updates'?'업데이트':title(active))+'</small>';el('backButton').disabled=(screen==='home'&&historyStack.length===0)}
function remember(){historyStack.push({screen:screen,active:active,tab:tab,noticeRoom:noticeRoom});if(historyStack.length>40)historyStack.shift()}
function restore(prev){active=prev.active;tab=prev.tab;noticeRoom=prev.noticeRoom;if(prev.screen==='room'){screen='room';V6.side(false);display(roomPage());V6.refresh()}else view(prev.screen,false)}
function menuBtn(txt,dest){return '<button onclick="V6.menuGo(\''+dest+'\')">'+txt+'</button>'}

 var d='<div style="font-size:20px;color:#f5d596;font-weight:900;padding:15px 0">⚓ V6 중앙통제실</div>';

 rooms.filter(function(r){return r.room_key!=='all'}).forEach(function(r){d+='<button onclick="V6.menuRoom(\''+r.room_key+'\')">⚓ '+esc(r.display_name)+'</button>'});
 d+=menuBtn('📁 앱자료실','appfiles')+menuBtn('🗂 라이브러리','library')+menuBtn('📚 기존 V5 자료실','legacy')+
 menuBtn('📊 누적DB','db')+menuBtn('🖼 실구매용 5조합','purchase')+menuBtn('🔐 배포용 승인','distribution')+
 menuBtn('🔔 공지사항','notices')+menuBtn('⚙ 설정 및 방제 관리','settings')+menuBtn('⬆ 업데이트 확인','updates');
 el('drawer').innerHTML=d;
}
function heading(h){return '<h1>'+h+'</h1>'}
function home(){
 var icons=['📢','🧭','🟢','🟠','🟣','🔵'];
 var d='<div class="home-screen"><div class="hero"><div class="logo">항행의자유 V6</div><b>중앙통제실</b><small>함께하는 항해, 하나의 바다로</small><div class="lighthouse">🗼</div><div class="sea"></div></div><div class="roomgrid">';
 rooms.slice(0,6).forEach(function(r,i){d+='<button onclick="'+(r.room_key==='all'?"V6.go('whole')":"V6.room('"+r.room_key+"')")+'"><span class="icon">'+icons[i]+'</span>'+esc(r.display_name)+'</button>'});
 d+='</div><div class="home-actions">'+
 '<button onclick="V6.go(\'source\')"><span class="action-icon">📜</span>원문 불러오기</button>'+
 '<button onclick="V6.go(\'analysis\')"><span class="action-icon">🔎</span>현재회차 분석</button>'+
 '<button onclick="V6.go(\'purchase\')"><span class="action-icon">🎯</span>실전구매 5조합</button></div>';
 if(rooms.length>6){d+='<section class="extra"><h3>새로 추가한 방</h3><div class="extragrid">';
 rooms.slice(6).forEach(function(r){d+='<button onclick="V6.room(\''+r.room_key+'\')">🧭 '+esc(r.display_name)+'</button>'});d+='</div></section>'}
 d+='<div class="footnav">'+menuBtn('📁 앱자료실','appfiles')+menuBtn('🗂 라이브러리','library')+menuBtn('⚙ 설정','settings')+'</div>';
 d+='<button class="primary home-exit" style="background:#164258;border-color:#6ca8b4" onclick="V6.exitApp()">🚪 앱 종료</button>';
 d+='<div class="hint home-hint">방별 자료 · 앱자료실 · V6 누적DB</div></div>';
 return d;
}
function roomTabs(){return '<div class="tabs">'+
 '<button class="'+(tab==='chat'?'active':'')+'" onclick="V6.tab(\'chat\')">대화방</button>'+
 '<button class="'+(tab==='files'?'active':'')+'" onclick="V6.tab(\'files\')">파일함</button>'+
 '<button class="'+(tab==='notices'?'active':'')+'" onclick="V6.tab(\'notices\')">공지</button></div>'}
function fileInput(){return '<label for="roundNumber">자료 회차</label><input type="number" min="1" max="9999" id="roundNumber" value="1246">'+
 '<label for="roomPicker">담당방 자료 · 휴대전화 또는 드라이브에서 선택</label>'+
 '<input id="roomPicker" type="file" multiple><p class="small">파일당 최대 10MB · 서버 기기 등록 필요. 원본은 V6 전용 폴더와 기존 앱 라이브러리에 색인됩니다.</p>'+
 '<button class="primary" onclick="V6.upload()">📤 해당 방 폴더에 업로드 및 자동 연동</button><div id="uploadOutput" class="hint"></div>'}
function fileItem(f,showRoom){

 async legacyFile(id){
  var record=legacyItems.find(function(x){return x.id===id});
  if(!record||record.import_status!=='IMPORTED')return alertMsg('해당 파일은 원본 이관 전입니다.');
  remember();screen='file';display(filePage());
  try{
   var out=await api('/legacy-download/'+id);if(!out.url)throw Error('원본 다운로드 주소 없음');
   el('fileInfo').innerHTML='<h2>'+esc(record.display_name)+'</h2>'+
      '<p class="hint">기존 서버 라이브러리에 보관된 원본입니다. 90초간 유효합니다.</p>'+
      '<a class="primary" style="display:block;text-align:center;text-decoration:none" href="'+esc(out.url)+'" target="_blank" rel="noopener noreferrer">⬇ 파일 열기 / 다운로드</a>';
  }catch(e){el('fileInfo').textContent='파일 조회 실패: '+e.message}
 },
 async upload(){
  if(busy)return;var input=el('roomPicker'),list=Array.from(input?.files||[]);
  if(!list.length)return alertMsg('업로드할 파일을 선택하세요.');
  var round=currentRound();if(!Number.isInteger(round)||round<1||round>9999)return alertMsg('회차는 1~9999 범위로 입력하세요.');
  if(list.some(function(f){return f.size<1||f.size>10485760}))return alertMsg('파일은 1바이트 이상 10MB 이하여야 합니다.');
  busy=true;var out=el('uploadOutput');out.textContent='파일 업로드 중…';
  try{for(var i=0;i<list.length;i++){out.textContent='원본 등록 중 '+(i+1)+' / '+list.length;
   var form=new FormData();form.append('room_key',active);form.append('round_no',String(round));form.append('file',list[i],list[i].name);
   var x=await api('/upload',{method:'POST',body:form});
   out.textContent+=' · '+(x.duplicate?'동일 자료 등록됨':'자료실·V6 누적DB 색인 완료')+(x.purchase_state==='PENDING_APPROVAL'?' · 실구매 검토 대기':'')+'\n';
  }input.value='';alertMsg('선택한 파일 처리 완료 · 자료실/누적DB 자동 연동 확인');await V6.refresh()}
  catch(e){out.textContent+='오류: '+e.message;alertMsg('업로드 실패: '+e.message)}finally{busy=false}
 },
 async broadcast(){
  if(busy)return;var subject=el('wholeSubject')?.value.trim(),body=el('wholeBody')?.value.trim();
  if(!subject||!body)return alertMsg('공지 제목과 내용을 입력하세요.');
  if(!confirm('모든 V6 담당방 서버 수신함으로 전달하겠습니까?'))return;
  var ids=Array.from(document.querySelectorAll('[data-attach]:checked')).map(function(x){return x.value});
  busy=true;
  try{var r=await api('/broadcast',{method:'POST',json:{subject:subject,body:body,attachment_ids:ids}});
   alertMsg('공지 저장 완료 · 수신함 '+r.delivered_inboxes+'개 (원본 ChatGPT 자동 게시 아님)');
   el('wholeSubject').value='';el('wholeBody').value='';
  }catch(e){alertMsg('공지 전달 실패: '+e.message)}finally{busy=false}
 },
 async sendChat(){
  var s=el('chatText')?.value.trim();if(!s)return alertMsg('메시지를 입력하세요.');
  try{await api('/messages',{method:'POST',json:{room_key:active,body:s}});el('chatText').value='';V6.refresh()}
  catch(e){alertMsg('메시지 저장 실패: '+e.message)}
 },
 async loadNotices(){
  if(!hold())return alertMsg('기기 등록이 필요합니다.');
  try{var r=await api('/notices?room_key='+noticeRoom);el('allNotices').innerHTML=formatNotices(r.notices||[])}
  catch(e){alertMsg('공지 조회 실패: '+e.message)}
 },
 noticeFilter:function(id){noticeRoom=id;V6.loadNotices()},
 async file(id){
  remember();screen='file';display(filePage());try{
   var x=await api('/download/'+id);
   if(!x.url)throw Error('다운로드 주소가 없습니다.');
   var info=currentFiles.find(function(z){return z.asset_id===id})||{filename:'자료 원본'};
   var url=esc(x.url),name=esc(info.filename);
   el('fileInfo').innerHTML='<h2>'+name+'</h2><p class="small">원본 파일 · 60초 임시 다운로드 주소</p>'+
    (/\.(jpg|jpeg|png|gif|webp)$/i.test(info.filename)?'<img class="previewimg" src="'+url+'" alt="등록 파일 미리보기">':'')+
    '<a class="primary" style="display:block;text-align:center;text-decoration:none" href="'+url+'" target="_blank" rel="noopener noreferrer">⬇ 원본 파일 열기 / 다운로드</a>';
  }catch(e){el('fileInfo').textContent='원본 파일 조회 실패: '+e.message}
 },
 async checkDevice(){
  var node=el('pairStatus');
  if(!hold()){
   if(node)node.textContent='이 앱에 유효한 형식의 기기 토큰이 저장되지 않았습니다. 새 1회용 연결코드가 필요할 수 있습니다.';
   alertMsg('등록 토큰이 이 앱에 없습니다. 인증코드를 다시 사용하지 마세요.');
   return false;
  }
  if(node)node.textContent='서버 기기 등록 상태를 확인하는 중…';
  try{
   var r=await fetch('https://jyqkohpeowkhuaohlezc.supabase.co/functions/v1/v4-room-sync/ping',
    {headers:{Authorization:'Bearer '+token()},cache:'no-store'});
   var data=await r.json();
   if(!r.ok||data.error||!data.device_id)throw Error(data.error||'SERVER_DEVICE_NOT_RECOGNIZED');
   if(node)node.textContent='✓ 서버 기기 인증 확인 완료 · 파일 업로드와 누적DB를 사용할 수 있습니다.';
   alertMsg('서버 기기 연결 확인 완료');
   return true;
  }catch(e){
   if(node)node.textContent='저장된 토큰으로 서버 인증 실패: '+String(e.message||e);
   alertMsg('기기 연결 확인 실패 · 기존 코드는 재사용하지 마세요.');
   return false;
  }
 },
 async pair(){
  if(pairingNow)return;
  var code=String(el('pairCode')&&el('pairCode').value||'').trim();
  if(hold()){
   var already=await V6.checkDevice();
   if(already)return alertMsg('이미 서버에 연결돼 있습니다. 코드를 다시 입력할 필요가 없습니다.');
  }
  if(!/^[a-f0-9]{20,128}$/.test(code))return alertMsg('유효한 1회용 연결코드를 입력하세요. 기존 소진된 코드는 재사용할 수 없습니다.');
  pairingNow=true;
  var submit=el('pairSubmit'),status=el('pairStatus');
  if(submit)submit.disabled=true;
  if(status)status.textContent='기기 등록 요청 전송 중 · 등록 버튼을 여러 번 누르지 마세요.';
  try{
   var response=await fetch(PAIR,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:code,device_name:'항행의자유 V6'}),cache:'no-store'
   });
   var data={};
   try{data=await response.json()}catch(e){throw Error('서버 응답을 읽을 수 없습니다. 코드가 사용됐을 수 있으므로 다시 입력하지 마세요.')}
   if(!response.ok||!data.token){
    if(data.error==='PAIR_INVALID_OR_USED')
     throw Error('이미 사용됐거나 만료된 코드입니다. 아래 [기기 연결 상태 확인]을 먼저 누르세요.');
    throw Error('서버 응답 '+response.status+': '+String(data.error||'등록에 실패했습니다.'));
   }
   setToken(data.token); // Store and read back BEFORE showing registration as successful.
   if(el('pairCode'))el('pairCode').value='';
   if(status)status.textContent='기기 토큰 저장 완료 · 서버 연결을 검증합니다.';
   var ok=await V6.checkDevice();
   if(!ok){
    if(status)status.textContent='기기 토큰은 저장됐으나 서버 연결 검증에 실패했습니다. [기기 연결 상태 확인]을 다시 누르세요.';
    return;
   }
   await V6.loadRooms();
   alertMsg('기기 등록 성공 · 인증 토큰 안전하게 저장됨');
  }catch(e){
   if(status)status.textContent='기기 등록 문제: '+String(e.message||e);
   alertMsg('기기 등록 실패: '+String(e.message||e));
  }finally{pairingNow=false;if(el('pairSubmit'))el('pairSubmit').disabled=false}
 },
 saveRoomName:async function(id){
  var field=el('rn_'+id),name=cleanTitle(field&&field.value);
  if(!validTitle(name))return alertMsg('방제는 공백을 제외한 1~32자로 입력하세요.');
  var row=rooms.find(function(r){return r.room_key===id});
  if(!row)return alertMsg('등록된 방이 없습니다.');
  prefs.names[id]=name;
  row.display_name=name;
  var saved=persistPrefs();
  if(!saved)return alertMsg('저장 공간이 비활성화됐습니다. 휴대전화 저장 설정을 확인하세요.');
  display(settings());
  if(hold()&&!row.pendingServer){
   try{await api('/room-rename',{method:'POST',json:{room_key:id,name:name}});
    return alertMsg('방제 저장 완료 · 서버에도 반영됐습니다.');
   }catch(e){return alertMsg('방제는 이 기기에 저장됨 · 서버에는 미반영: '+e.message)}
  }
  alertMsg('방제 저장 완료 · 이 기기에 보관됨'+(row.pendingServer?' (방 서버 등록 필요)':''));
 },
 saveRoomLink:function(id){
  var field=el('rl_'+id),value=String(field&&field.value||'').trim();
  if(value&&!isOriginalLink(value))return alertMsg('ChatGPT 원본 대화 주소를 입력하세요. 일반 대화 /c/ 또는 프로젝트 대화 /g/…/c/ 형식이 가능합니다.');
  if(value)prefs.links[id]=value;else delete prefs.links[id];
  if(!persistPrefs())return alertMsg('링크 저장 실패 · 기기 저장 공간 확인 필요');
  alertMsg(value?'원본 대화방 링크를 이 기기에 저장했습니다.':'등록한 원본 대화방 링크를 비웠습니다.');
 },
 openRoomLink:function(id){
  var url=prefs.links[id];
  if(!isOriginalLink(url))return alertMsg('먼저 링크를 입력하고 [링크 저장]을 눌러 주세요.');
  window.location.assign(url);
 },
 async addRoom(){
  var field=el('newRoomName'),name=cleanTitle(field&&field.value);
  if(!validTitle(name))return alertMsg('새 방 이름은 1~32자로 입력하세요.');
  if(rooms.length>=100)return alertMsg('방은 최대 100개까지 등록할 수 있습니다.');
  var id='extra_'+((window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID().replace(/-/g,''):
   Date.now().toString(36)+Math.random().toString(36).slice(2,18));
  if(rooms.some(function(x){return x.room_key===id}))return alertMsg('방 번호가 겹쳤습니다. 다시 눌러 주세요.');
  prefs.extras.push({room_key:id,display_name:name,pendingServer:true});
  prefs.names[id]=name;
  if(!persistPrefs()){prefs.extras.pop();delete prefs.names[id];return alertMsg('기기 저장 실패')}
  rooms.push({room_key:id,display_name:name,pendingServer:true,fixed:false});
  display(settings());
  alertMsg('새 방 '+name+' 등록 완료 · 기기에 저장됨. 서버 파일함은 기기 인증 후 [서버에 동기화]가 필요합니다.');
 },
 async syncLocalRooms(){
  if(!hold())return alertMsg('서버 동기화는 1회용 코드로 기기를 등록한 뒤 가능합니다.');
  var successes=0,failures=0;
  try{
   var current=await api('/rooms');
   var remote=current.rooms||[];
   for(var i=0;i<prefs.extras.length;i++){
    var item=prefs.extras[i];
    if(!item.pendingServer)continue;
    try{
     var out=await api('/room-add',{method:'POST',json:{name:prefs.names[item.room_key]||item.display_name}});
     var old=item.room_key,id=out.room&&out.room.room_key;
     if(!id)throw Error('ROOM_ID_NOT_RETURNED');
     item.room_key=id;item.pendingServer=false;
     prefs.names[id]=prefs.names[old]||item.display_name;
     if(prefs.links[old])prefs.links[id]=prefs.links[old];
     delete prefs.names[old];delete prefs.links[old];
     successes++;
    }catch(e){failures++}
   }
   persistPrefs();
   for(var k of Object.keys(prefs.names)){
    try{
     await api('/room-rename',{method:'POST',json:{room_key:k,name:prefs.names[k]}});
     successes++;
    }catch(e){failures++}
   }
   await V6.loadRooms();
   display(settings());
   alertMsg('서버 동기화: 성공 '+successes+'건'+(failures?' · 실패 '+failures+'건 (기기 설정은 보존됨)':' · 완료'));
  }catch(e){alertMsg('서버 연결 실패 · 기기 설정은 그대로 보존됩니다: '+e.message)}
 },
 setOriginal:function(id){V6.openRoomLink(id)},
 original:function(){V6.openRoomLink(active)},
 setTheme:function(name){if(!['sea','night','sunrise','sunset','snow'].includes(name))return;localStorage.setItem(THEME,name);document.body.dataset.theme=name;view('settings')}
};
function formatNotices(list){
 return list.length?list.map(function(n){
  return '<div class="rowitem"><b>📢 '+esc(n.subject)+'</b><p>'+esc(n.body).replace(/\n/g,'<br>')+'</p>'+
   '<span class="small">'+esc(new Date(n.created_at).toLocaleString('ko-KR'))+' · 첨부 '+(n.attachment_ids||[]).length+'건</span>'+
   (n.attachment_ids||[]).map(function(id){return '<button class="mini" onclick="V6.file(\''+id+'\')">📎 첨부파일</button>'}).join('')+'</div>';
 }).join(''):'등록된 공지가 없습니다.';
}
function formatPurchase(list){
 if(!list.length)return '아직 V6에서 자동 추출된 실구매 5조합이 없습니다.';
 var byId={};list.forEach(function(x){(byId[x.asset_id]??=[]).push(x)});
 return Object.keys(byId).map(function(id){var rows=byId[id],pending=rows[0].approval_status!=='APPROVED';
  return '<div class="rowitem"><b>'+rows[0].round_no+'회 · '+(pending?'형식검증 완료 / 승인 대기':'실구매 승인 완료')+'</b>'+
   rows.map(function(x){return '<div style="padding:5px">'+x.set_index+'조합 : <strong>'+x.numbers.join(' · ')+'</strong></div>'}).join('')+
   (pending&&rows.length===5?'<button class="mini" onclick="V6.approve(\''+id+'\')">실구매 최종 승인</button>':'')+'</div>';
 }).join('');
}
V6.approve=async function(id){
 if(!confirm('검증한 5조합을 실구매용으로 최종 승인하시겠습니까?'))return;
 try{await api('/purchase-approve',{method:'POST',json:{asset_id:id,confirm:true}});alertMsg('실구매 승인 상태 저장');V6.refresh()}
 catch(e){alertMsg('실구매 승인 실패: '+e.message)}
};
async function loadAttach(){
 if(!hold())return;
 try{var files=(await api('/library')).files||[];
  el('attachList').innerHTML=files.length?files.slice(0,30).map(function(f){return '<label style="display:flex;gap:8px;align-items:center"><input data-attach type="checkbox" style="width:auto" value="'+f.asset_id+'">'+esc(f.filename)+'</label>'}).join(''):'등록된 V6 파일 없음 · 담당방 파일함에서 먼저 업로드해 주세요.';
 }catch(e){el('attachList').textContent='첨부 목록 조회 실패: '+e.message}
}
window.V6=V6;document.body.dataset.theme=theme();view('home');V6.loadRooms();
})();
</script></body></html>
