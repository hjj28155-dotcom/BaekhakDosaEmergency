name: Build Freedom V4.0.31 Approval Recovery
on:
  push:
    paths:
      - '.github/workflows/build-v430-approval-recovery.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build approval recovery
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/항행의자유_V4.0.31_승인흐름복구_R10.apk"
          sha256sum "$GITHUB_WORKSPACE/항행의자유_V4.0.31_승인흐름복구_R10.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE_FREEDOM_V4_0_31_APPROVAL_RECOVERY_R10
          path: 항행의자유_V4.0.31_승인흐름복구_R10.apk
      - name: Publish APK and latest alias
        run: |
          set -euo pipefail
          cp 항행의자유_V4.0.31_승인흐름복구_R10.apk FREEDOM_V3_FINAL_LATEST.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f 항행의자유_V4.0.31_승인흐름복구_R10.apk FREEDOM_V3_FINAL_LATEST.apk
          git commit -m "Publish V4.0.31 approval flow recovery R10" || exit 0
          git push origin main
