name: Inspect APK package
on:
  push:
    paths:
      - '.github/workflows/inspect-apk.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Inspect
        shell: bash
        run: |
          set -e
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging V3_BUTTON_STAGE1.apk | head -20 > apk_badging.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk_badging.txt
          git commit -m 'Inspect APK package' || exit 0
          git push
