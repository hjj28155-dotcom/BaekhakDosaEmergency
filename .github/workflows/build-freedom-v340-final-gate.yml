name: Freedom V4.0.36 engine UI scoring final gate
on:
  push:
    branches:
      - fix-freedom-v3-screen-1244-20261022
    paths:
      - '.github/workflows/build-freedom-v340-final-gate.yml'
      - 'build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/index.html'
      - 'build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/db1_v1247_patch.js'
      - 'build407/FREEDOM_V402_BUILD_THIS/app/build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify DB1 source and no retrospectively generated score
        run: |
          set -euo pipefail
          BASE=build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets
          node - <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const p='build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/';
          const html=fs.readFileSync(p+'index.html','utf8');
          assert.match(html,/1244:\{nums:\[1,13,18,26,34,38\],bonus:25\}/);
          assert.match(html,/v340ResponsiveResultRepair/);
          assert.match(html,/v340BackLabel/);
          assert.match(html,/r5hit\{box-sizing:border-box/);
          assert.match(html,/이미 발표된 회차를 당첨번호에 맞춰 새로 분석/);
          assert.doesNotMatch(html,/V330_AFTER='result';runAnalysisFromHome\(\);return/);
          assert.match(html,/const V330_RECENT=\[1243,1244,1245,1246,1247\]/);
          const ctx={window:{}};ctx.window.window=ctx.window;
          vm.runInNewContext(fs.readFileSync(p+'raw_bank.js','utf8'),ctx,{timeout:30000});
          const original1244=ctx.window.V3_RAW_BANK['1244'].text;
          vm.runInNewContext(fs.readFileSync(p+'db1_v1247_patch.js','utf8'),ctx,{timeout:30000});
          assert.equal(ctx.window.DB1_UPDATE_1247.status,'PASS');
          assert.equal(ctx.window.V3_RAW_BANK_META.count,1247);
          assert.equal(ctx.window.V3_RAW_BANK['1244'].text,original1244);
          for(let i=1;i<=1247;i++) assert.equal(ctx.window.V3_RAW_BANK[String(i)].text.split(/\r?\n/).filter(Boolean).length,6,'round '+i);
          console.log('PASS: UI, fixed historical scoring, 1244 raw unchanged, DB1 1-1247');
          NODE
      - name: Build APK from source without trial application ID
        working-directory: build407/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew assembleDebug --no-daemon
      - name: Verify actual APK and installed app update signature
        run: |
          set -euo pipefail
          APK=build407/FREEDOM_V402_BUILD_THIS/app/build/outputs/apk/debug/FREEDOM_V4_0_36_SCORE_FIX-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -p "$APK" assets/index.html | grep -q 'v340ResponsiveResultRepair'
          unzip -p "$APK" assets/db1_v1247_patch.js | grep -q 'DB1_UPDATE_1247'
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -8
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.navigator.freedom.v3final' versionCode='40036'"
          "$APKSIGNER" verify --print-certs "$APK" | tee candidate-signature.txt
          "$APKSIGNER" verify --print-certs FREEDOM_V3_FINAL_LATEST.apk | tee installed-baseline-signature.txt
          A=$(grep 'certificate SHA-256 digest:' candidate-signature.txt | head -1 | awk '{print $NF}')
          B=$(grep 'certificate SHA-256 digest:' installed-baseline-signature.txt | head -1 | awk '{print $NF}')
          printf 'candidate SHA-256 signer: %s\nbaseline SHA-256 signer: %s\n' "$A" "$B"
          if [ "$A" != "$B" ]; then
            echo 'HOLD: signature mismatch. Existing app upgrade unsafe.'
            exit 9
          fi
          cp "$APK" Freedom_V4.0.36_DB1_1247_UI1244_SIGN_MATCH.apk
          sha256sum Freedom_V4.0.36_DB1_1247_UI1244_SIGN_MATCH.apk > Freedom_V4.0.36.sha256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Freedom_V4_0_36_SignedUpdate_GATED
          path: |
            Freedom_V4.0.36_DB1_1247_UI1244_SIGN_MATCH.apk
            Freedom_V4.0.36.sha256
          if-no-files-found: error
          retention-days: 14
