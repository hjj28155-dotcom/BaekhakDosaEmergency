name: Build Freedom V3 Final 405
on:
  push:
    paths:
      - '.github/workflows/build-final-405.yml'
      - '.github/scripts/patch_final_405.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download V404 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-0278-8206-ab0e-5e189efec998/raw?se=2026-09-30T23%3A58%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=2fc10d91-152e-5355-a02c-ff9032277f67&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T16%3A37%3A21Z&ske=2026-10-01T16%3A37%3A21Z&sks=b&skv=2026-02-06&sig=wgcC8/J%2BhTQyhZognlPuH00aTHm9Vt6FFyf5xsDdpEI%3D' -o source.zip
          rm -rf build405
          mkdir build405
          unzip -q source.zip -d build405
          test -f build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/index.html

      - name: Download final welcome scroll
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1264-8206-9f17-30e5ee2d66d7/raw?se=2026-10-01T00%3A02%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=b01dace9-c64b-5aeb-8381-8c214af3f48c&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T23%3A25%3A10Z&ske=2026-10-01T23%3A25%3A10Z&sks=b&skv=2026-02-06&sig=6WzGTKE%2BttsOzhrWU0W3HD49BP0WI%2BwZN/xnJoFaFA4%3D' -o build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/welcome_scroll_final.png
          test -s build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/welcome_scroll_final.png

      - name: Patch final order
        run: python3 .github/scripts/patch_final_405.py

      - name: Build final APK
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" ../../FREEDOM_V3_FINAL_405-debug.apk

      - name: Publish only final V3 APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find . -maxdepth 1 -type f \( -name 'FreedomV3_*.apk' -o -name 'FREEDOM_V3_*.apk' -o -name 'V3_*debug.apk' \) -delete
          cp build405/FREEDOM_V3_FINAL_405-debug.apk ./FREEDOM_V3_FINAL_405-debug.apk
          git add -A
          git commit -m 'Publish Freedom V3 final 405 ordered onboarding'
          git push
