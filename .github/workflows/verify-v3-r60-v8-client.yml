name: Verify V3 R60 V8 client source module
on:
  push:
    branches: ['feature/v8-v7-retirement-v3-link-20261029']
    paths: ['integrations/v3-r60-v8-client/**', 'crew-meeting-android/**', '.github/workflows/verify-v3-r60-v8-client.yml']
  pull_request:
    paths: ['integrations/v3-r60-v8-client/**', 'crew-meeting-android/**', '.github/workflows/verify-v3-r60-v8-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Compile Android library (no APK, no signing)
        working-directory: integrations/v3-r60-v8-client/android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix /tmp/v3v8-tests playwright@1.56.1
          /tmp/v3v8-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify real IndexedDB preservation and ACK rejection
        env: {NODE_PATH: '/tmp/v3v8-tests/node_modules'}
        run: node integrations/v3-r60-v8-client/tests/adapter.spec.cjs
      - name: Verify director room navigation on three phone sizes
        env: {NODE_PATH: '/tmp/v3v8-tests/node_modules'}
        run: node integrations/v3-r60-v8-client/tests/director-room.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-804-director-room-ui-evidence
          path: ui-evidence/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: v3-r60-v8-source-library-not-installable
          path: integrations/v3-r60-v8-client/android/build/outputs/aar/*debug.aar
