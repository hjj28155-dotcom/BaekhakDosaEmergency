name: Restore full V3 guide video
on:
  push:
    paths:
      - '.github/workflows/restore-full-guide-video.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace short guide with final full guide
        run: |
          cp "항행의자유_V3_설명서_최종버전_20260925.mp4" freedom_guide_latest.mp4
          test "$(stat -c%s freedom_guide_latest.mp4)" -gt 1000000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom_guide_latest.mp4
          git commit -m "Restore full V3 guide video"
          git push

# restore 12-screen full guide
