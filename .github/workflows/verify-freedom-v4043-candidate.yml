name: Verify isolated Freedom V4.0.43 candidate
on:
  push:
    branches:
      - fix/freedom-v4043-repeat-approval-round-combos-20261027
      - fix/freedom-v4043-reference-pack-20261027
      - fix/freedom-v4043-history-effective-20261027
      - fix/freedom-v4043-locked-purchase-message-guard-20261027
      - fix/freedom-v4043-engine-stale-result-guard-20261027
    paths:
      - 'build405/FREEDOM_V402_BUILD_THIS/app/**'
      - '.github/workflows/verify-freedom-v4043-candidate.yml'
      - '.github/scripts/verify_freedom_v4043.cjs'
      - '.github/scripts/verify_freedom_v4043_references.cjs'
      - '.github/scripts/verify_freedom_v4043_real_engine.cjs'
      - '.github/scripts/validate_freedom_r14.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate database, onboarding and DB-1 20-combo fallback
        run: |
          set -euo pipefail
          node .github/scripts/validate_freedom_r14.cjs
          node .github/scripts/verify_freedom_v4043.cjs
      - name: Execute genuine V1.3 engine against four preserved DB-1 rounds (no mock engine)
        run: |
          set -euo pipefail
          node .github/scripts/verify_freedom_v4043_real_engine.cjs
      - name: Inspect existing engine DB-1 and V3 analysis contract
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/engine_v2.html','utf8');
          const keys=['백학.txt','백학설명서','백학 설명서','꿈사전','최신 꿈사전','성공사례','성공 사례','dream_dictionary','dreamDictionary','successCases','BAEKHAK_TXT','baekhak.txt','V3_ANALYZE','DB1','RAW_BANK'];
          for(const key of keys){
            const count=s.split(key).length-1,p=s.lastIndexOf(key);
            console.log('=== ENGINE CONTRACT',key,'instances',count,'lastIndex',p);
            if(p>=0)console.log(s.slice(Math.max(0,p-120),Math.min(s.length,p+280)).replace(/[\x00-\x08]/g,' ').slice(0,480));
          }
          console.log('engine asset bytes',Buffer.byteLength(s,'utf8'));
          NODE
      - name: Validate embedded original reference materials and active dream bridge
        run: |
          set -euo pipefail
          node .github/scripts/verify_freedom_v4043_references.cjs
      - name: Verify Android asset merge without creating or replacing signer
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew :app:mergeDebugAssets --no-daemon
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('app/build/intermediates/assets')
          if not root.exists(): raise SystemExit('Android merged assets missing')
          files=list(root.rglob('reference_sources/백학.txt'))
          if not files: raise SystemExit('Original master absent from merged Android assets')
          base=files[0].parent.parent
          checks={
              'reference_sources/백학.txt': '4f8059ee26987ac1482ac687ddbe4056e7215ccbd7e719e8377bff7eb097eb3a',
              'reference_sources/백학 로또꿈해몽백과 2026 6월신버젼 (1).txt': '1842831fe89e7d413a3ae6ea46fafd774e333c084750d80e90aff4f880a8b722',
          }
          for name,h in checks.items():
              p=base/name
              if not p.is_file() or hashlib.sha256(p.read_bytes()).hexdigest()!=h:
                  raise SystemExit('Android asset missing/hash mismatch: '+name)
          for name in ('index.html','freedom_reference_v4043.js','reference_sources_manifest_v4043.json'):
              if not (base/name).is_file(): raise SystemExit('Missing merged asset: '+name)
          print('PASS: Android merge contains exact master SHA256 and UTF8 dream SHA256, index, engine adapter, manifest. No APK signing.')
          PY
      - name: Compile isolated release and inspect unsigned APK (DO NOT DISTRIBUTE)
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          apks=list(Path('app/build/outputs/apk/release').glob('*.apk'))
          if len(apks)!=1: raise SystemExit(f'Expected exactly one unsigned internal release APK, found {len(apks)}')
          apk=apks[0]
          checks={
            'assets/reference_runtime/baekhak_master_v2.txt':'4f8059ee26987ac1482ac687ddbe4056e7215ccbd7e719e8377bff7eb097eb3a',
            'assets/reference_runtime/dream_dictionary_2026_06_utf8.txt':'1842831fe89e7d413a3ae6ea46fafd774e333c084750d80e90aff4f880a8b722',
            'assets/reference_runtime/official_manual_197_202_candidate.txt':'52769ee60f5d0346b97d1a51bbb37c2dc0b55651088551f53e4bd8ac8deeba7f',
            'assets/reference_runtime/success_classification_rule_3of6.txt':'86b69c401570e3698397729ef8a48f405fc6ff551930b6c9cdccedace8c8dc7c',
            'assets/reference_runtime/success_retrospective_learning.txt':'89a665d0a4de0ae10121b5db3629a37dca70578066d6181aa23a695bd9c6be1b',
            'assets/reference_runtime/success_retrospective_3of6.txt':'bcbc7ebe0dd272540892e52fcf7aef48189d2ba02428d4d987a4415e990e1b16',
            'assets/reference_runtime/official_decoding_rules_v1.txt':'657e3a32b0b7be6bc9cc7d40a327232a4502706c05f8ae99ac53ae9478999ad1',
            'assets/reference_runtime/success_master_6of6_20260818.txt':'53d38c03de30c08aee51422e5bd37cefcb40b6771cee8e67206e3a8b72e9c39f',
            'assets/reference_runtime/success_patterns_1001_1033.txt':'26b05caf362dd46b3e01e6ac0464bb4ff3419b954b0c1a97f78aa53ed1a8911e',
          }
          with zipfile.ZipFile(apk) as z:
            names=set(z.namelist())
            print('CI ZIP portable reference paths:',sorted(n for n in names if n.startswith('assets/reference_runtime/')))
            print('CI ZIP assets count:',len([n for n in names if n.startswith('assets/')]))
            for n in checks:
              if n in names:
                print('CI ZIP digest:',n,hashlib.sha256(z.read(n)).hexdigest())
              else:
                print('CI ZIP missing expected path:',n)
            assert 'classes.dex' in names, 'No Android dex classes'
            for name,digest in checks.items():
              if name not in names or hashlib.sha256(z.read(name)).hexdigest()!=digest:
                raise SystemExit('APK asset absent/hash mismatch: '+name)
            for name in ('assets/index.html','assets/engine_v2.html','assets/raw_bank.js','assets/db1_v1247_patch.js','assets/freedom_reference_v4043.js','assets/reference_sources_manifest_v4043.json'):
              if name not in names: raise SystemExit('APK asset missing: '+name)
            index=z.read('assets/index.html').decode('utf-8')
            assert 'src="freedom_reference_v4043.js"' in index, 'Active reference module must be loaded'
          print('PASS: full Android release compilation and internal unsigned ZIP assets checked; NO signing or distribution.')
          PY
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -m1 '^package:' | tee /tmp/internal_unsigned_badging.txt
          grep -q "package: name='com.navigator.freedom.v3final' versionCode='40043'" /tmp/internal_unsigned_badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if "$APKSIGNER" verify "$APK" >/tmp/unsigned_verify.txt 2>&1; then
            echo 'ERROR: internal research release unexpectedly signed; stop before distribution.'
            exit 1
          fi
          echo 'PASS: research-only APK intentionally unsigned, excluded from artifacts.'
          rm -f "$APK"
          PYTHONWARNINGS=ignore python3 - <<'PY'
          from pathlib import Path
          assert not list(Path('app/build/outputs/apk/release').glob('*.apk')), 'Research unsigned artifact must not remain for upload'
          PY
      - name: Restore original Freedom signer
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: freedom-v436-production-debug-signer-20261022
          fail-on-cache-miss: true
      - name: Build signed candidate
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        run: |
          chmod +x ./gradlew
          sed -i '/org.gradle.java.home/d' gradle.properties
          ./gradlew :app:assembleDebug --no-daemon
      - name: Verify same package and signer
        run: |
          set -euo pipefail
          APK=build405/FREEDOM_V402_BUILD_THIS/app/build/outputs/apk/debug/HANGHAE_FREEDOM_V4_0_43_FINAL.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.navigator.freedom.v3final' versionCode='40043'" /tmp/badging.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/signer.txt
          grep -q 'certificate SHA-256 digest: bf281903f422fe925a23a7e72e82d690eaef899236e6d10365143ff32d9beb00' /tmp/signer.txt
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/freedom_onboarding_r14.js'
          unzip -l "$APK" | grep -q 'assets/raw_bank.js'
          unzip -l "$APK" | grep -q 'assets/db1_v1247_patch.js'
          unzip -l "$APK" | grep -q 'assets/freedom_reference_v4043.js'
          unzip -l "$APK" | grep -q 'assets/reference_sources/백학.txt'
          unzip -l "$APK" | grep -q 'assets/reference_sources_manifest_v4043.json'
          mkdir -p artifacts
          cp "$APK" artifacts/HanghaeFreedom_V4.0.43_candidate.apk
          (cd artifacts && sha256sum HanghaeFreedom_V4.0.43_candidate.apk > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE-FREEDOM-V4.0.43-CANDIDATE
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
