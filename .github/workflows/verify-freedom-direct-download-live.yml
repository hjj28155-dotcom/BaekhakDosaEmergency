name: Verify Drive-linked Freedom V4.0.39 release integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-freedom-direct-download-live.yml'
      - moveicon.html
      - freedom-latest.apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify source APK remains immutable and canonical web button is Drive-linked
        shell: bash
        run: |
          set -euo pipefail
          test -s freedom-latest.apk
          test "$(stat -c%s freedom-latest.apk)" -eq 44054241
          printf '%s  %s\n' '4661b2d2f59ac462ae48aa85c4b9457d0e5adf7a77680aaac31a440af6be9b83' 'freedom-latest.apk' | sha256sum --check -
          unzip -t freedom-latest.apk | tail -1
          unzip -l freedom-latest.apk | grep -q 'assets/raw_bank.js'
          unzip -l freedom-latest.apk | grep -q 'assets/db1_v1247_patch.js'
          grep -q 'FREEDOM-7STAGE-DRIVE-NO-DUPLICATE-20261026' moveicon.html
          grep -q 'drive.google.com/file/d/1-YadPjhG7J8cpA2-xFfi-WxjEVBvgEE5/view' moveicon.html
          grep -q 'freedom_onboarding_latest.mp4' moveicon.html
          ! grep -q 'Hanghae_MoveIcon_' moveicon.html
          ! grep -q '다운로드 중지' moveicon.html
          echo 'PASS: original APK SHA-256, DB, canonical Drive URL and steps 6/7 source'
      - name: Note Drive external sharing is a distinct permission requirement
        run: |
          echo 'INFORMATION: Google Drive file visibility is not changed by updating the installation page.'
          echo 'Do not claim public download works without verifying Google Drive sharing permissions.'
