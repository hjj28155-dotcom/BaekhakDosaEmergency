name: Verify full same-origin Freedom APK download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-freedom-direct-download-live.yml'
      - 'moveicon.html'
      - 'update.html'
      - 'freedom-latest.apk'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify_download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK page link and downloadable binary from live Pages
        run: |
          set -euo pipefail
          SITE='https://hjj28155-dotcom.github.io/BaekhakDosaEmergency'
          CACHE_Q='?release=v4.0.39-check'
          curl -fL --retry 4 --retry-delay 3 --max-time 90 "$SITE/moveicon.html$CACHE_Q" -o /tmp/live-moveicon.html
          curl -fL --retry 4 --retry-delay 3 --max-time 90 "$SITE/update.html$CACHE_Q" -o /tmp/live-update.html
          grep -q 'V7-SEVEN-STAGE-20261023' /tmp/live-moveicon.html
          grep -q 'id="freedomApkInstall"' /tmp/live-moveicon.html
          grep -q 'href="./freedom-latest.apk"' /tmp/live-moveicon.html
          grep -q 'href="./freedom-latest.apk"' /tmp/live-update.html
          ! grep -q 'Hanghae_MoveIcon_' /tmp/live-moveicon.html
          echo 'PASS: both live Freedom buttons point to same-origin APK'
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 220 "$SITE/freedom-latest.apk$CACHE_Q" -o /tmp/freedom-latest.apk
          test "$(stat -c %s /tmp/freedom-latest.apk)" -eq 44054241
          printf '%s  %s\n' '4661b2d2f59ac462ae48aa85c4b9457d0e5adf7a77680aaac31a440af6be9b83' /tmp/freedom-latest.apk | sha256sum --check -
          unzip -t /tmp/freedom-latest.apk | tail -1
          unzip -l /tmp/freedom-latest.apk | grep -q 'assets/raw_bank.js'
          unzip -l /tmp/freedom-latest.apk | grep -q 'assets/db1_v1247_patch.js'
          echo 'PASS: public same-origin APK downloaded fully with correct SHA-256 and required DB assets'
