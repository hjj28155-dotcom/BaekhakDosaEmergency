name: Publish V1 R2760 APK

on:
  push:
    paths:
      - '.github/workflows/publish-v1-r2760.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download V1 APK
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-daa0-8206-ab92-dde168ddac2f/raw?se=2026-09-27T04%3A22%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=437b7774-0289-58a5-b652-6291279d5fb1&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T18%3A42%3A52Z&ske=2026-09-27T18%3A42%3A52Z&sks=b&skv=2026-02-06&sig=gd4BQmYP8Ar8sgBPEOQxV429FkoLbexOcdYtk5DrhN8%3D' -o V1_R2760_LOCAL_MUSIC_FINAL.apk
          test "$(stat -c%s V1_R2760_LOCAL_MUSIC_FINAL.apk)" -gt 10000000
      - name: Commit APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V1_R2760_LOCAL_MUSIC_FINAL.apk
          git commit -m 'Publish V1 R2760 update APK' || exit 0
          git push
