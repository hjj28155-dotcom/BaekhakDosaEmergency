name: Assemble verified N2 6.21.35 APK
on:
  push:
    branches: [n2-r62135-publish-20261110]
    paths: ['.github/workflows/n2-r62135-assemble.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify exact owner-signed binary
        shell: bash
        run: |
          set -euo pipefail
          dir=r6-n2-standalone/publish-621935
          target="$dir/N2_R62135_DB1_1250_1251_SIGNED.apk"
          count=$(find "$dir/payload" -name 'part*.b64' -type f | wc -l)
          test "$count" -eq 16
          cat "$dir"/payload/part*.b64 | base64 --decode > "$target"
          test "$(stat -c%s "$target")" -eq 2280637
          printf '%s  %s\n' '38d7d4a4e5d991526eb29dd86be56026abd37bd3d9dc4d4d686e67b67730e40d' "$target" | sha256sum --check
          python3 - <<'PY'
          import zipfile
          p='r6-n2-standalone/publish-621935/N2_R62135_DB1_1250_1251_SIGNED.apk'
          with zipfile.ZipFile(p) as f:
            assert f.testzip() is None
            assert 'assets/index.html' in f.namelist()
            assert 'AndroidManifest.xml' in f.namelist()
          print('APK ZIP integrity PASS')
          PY
      - name: Commit only assembled APK to isolated release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r6-n2-standalone/publish-621935/N2_R62135_DB1_1250_1251_SIGNED.apk
          if ! git diff --cached --quiet; then
            git commit -m 'release(n2): verify and assemble owner-signed 621935 APK (isolated channel)'
            git push
          fi
