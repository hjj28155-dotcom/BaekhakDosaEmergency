name: Build latest correct-order installation guide
# retrigger 20261002-final2
on:
  push:
    paths:
      - '.github/workflows/build-latest-correct-order-guide.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and Korean font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Build corrected guide from latest visual source
        run: |
          set -euo pipefail
          SRC="build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/install_guide_final.mp4"
          test -f "$SRC"
          mkdir -p /tmp/guide
          FONT="/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"

          # Keep the newest original visual sequence 1~6 and screen 10.
          # Re-encode to one consistent video format; audio is added only once at the end.
          ffmpeg -hide_banner -loglevel error -y -ss 0 -i "$SRC" -t 90 -an -vf "fps=30,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 /tmp/guide/pre.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 90 -i "$SRC" -t 15 -an -vf "fps=30,format=yuv420p" -c:v libx264 -preset veryfast -crf 20 /tmp/guide/post.mp4

          # Use the original screen-6 visual as the design base for the missing 7/8/9 screens.
          ffmpeg -hide_banner -loglevel error -y -ss 82 -i "$SRC" -frames:v 1 /tmp/guide/base.png

          make_slide(){
            n="$1"; title="$2"; a="$3"; b="$4"; c="$5"
            printf '%s' "$title" > "/tmp/guide/title_${n}.txt"
            printf '%s' "$a" > "/tmp/guide/a_${n}.txt"
            printf '%s' "$b" > "/tmp/guide/b_${n}.txt"
            printf '%s' "$c" > "/tmp/guide/c_${n}.txt"
            ffmpeg -hide_banner -loglevel error -y               -loop 1 -i /tmp/guide/base.png               -t 15               -vf "drawbox=x=88:y=515:w=688:h=760:color=0x062b49@0.98:t=fill,drawbox=x=108:y=535:w=648:h=720:color=0xD7B95A@0.95:t=3,drawbox=x=128:y=570:w=608:h=125:color=0x0A4C7B@0.98:t=fill,drawtext=fontfile=${FONT}:text='${n}':fontcolor=0xF6D56D:fontsize=72:x=152:y=592,drawtext=fontfile=${FONT}:textfile=/tmp/guide/title_${n}.txt:fontcolor=white:fontsize=47:x=245:y=595,drawtext=fontfile=${FONT}:text='1':fontcolor=0xF6D56D:fontsize=42:x=148:y=770,drawtext=fontfile=${FONT}:textfile=/tmp/guide/a_${n}.txt:fontcolor=white:fontsize=31:x=215:y=780,drawtext=fontfile=${FONT}:text='2':fontcolor=0xF6D56D:fontsize=42:x=148:y=900,drawtext=fontfile=${FONT}:textfile=/tmp/guide/b_${n}.txt:fontcolor=white:fontsize=31:x=215:y=910,drawtext=fontfile=${FONT}:text='3':fontcolor=0xF6D56D:fontsize=42:x=148:y=1030,drawtext=fontfile=${FONT}:textfile=/tmp/guide/c_${n}.txt:fontcolor=white:fontsize=31:x=215:y=1040"               -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -r 30 "/tmp/guide/slide_${n}.mp4"
          }

          make_slide 7 "최신 두루마리" "설치 후 앱을 실행하면" "최신 두루마리를 확인합니다." "두루마리를 눌러 다음으로 이동합니다."
          make_slide 8 "승인 요청" "승인요청 화면에서" "사용 승인 요청을 보냅니다." "승인 전에는 홈 기능이 잠깁니다."
          make_slide 9 "안내 동영상" "승인요청이 접수되면" "안내 동영상을 끝까지 봅니다." "항해사 승인 후 홈으로 들어갑니다."

          # Normalize and concatenate all five video segments in one filter graph.
          ffmpeg -hide_banner -loglevel error -y \
            -i /tmp/guide/pre.mp4 \
            -i /tmp/guide/slide_7.mp4 \
            -i /tmp/guide/slide_8.mp4 \
            -i /tmp/guide/slide_9.mp4 \
            -i /tmp/guide/post.mp4 \
            -f lavfi -i "anullsrc=r=48000:cl=stereo" \
            -filter_complex "[0:v]fps=30,format=yuv420p,setpts=PTS-STARTPTS[v0];[1:v]fps=30,format=yuv420p,setpts=PTS-STARTPTS[v1];[2:v]fps=30,format=yuv420p,setpts=PTS-STARTPTS[v2];[3:v]fps=30,format=yuv420p,setpts=PTS-STARTPTS[v3];[4:v]fps=30,format=yuv420p,setpts=PTS-STARTPTS[v4];[v0][v1][v2][v3][v4]concat=n=5:v=1:a=0[v]" \
            -map "[v]" -map 5:a -t 150 \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 96k freedom_guide_latest.mp4

          ffprobe -v error -show_entries format=duration,size -of default=nw=1 freedom_guide_latest.mp4
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 freedom_guide_latest.mp4)
          awk "BEGIN{exit !($D > 145 && $D < 155)}"
          # Sanity-check expected ten-screen sequence length: 6 originals + 3 restored + original 10.
          test "$(stat -c%s freedom_guide_latest.mp4)" -gt 1000000
      - name: Publish corrected latest guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom_guide_latest.mp4
          git commit -m "Publish latest guide with correct 1-10 order and restored 7-9" || exit 0
          git push
