name: Build install guide first 6 only
# retrigger 20261002-first6-only
on:
  push:
    paths:
      - '.github/workflows/build-latest-correct-order-guide.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Build installation guide 1 through 6 only
        run: |
          set -euo pipefail
          SRC="build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/install_guide_final.mp4"
          test -f "$SRC"
          ffmpeg -hide_banner -loglevel error -y -ss 0 -i "$SRC" -t 90 -an             -vf "fps=30,format=yuv420p"             -c:v libx264 -preset veryfast -crf 20             -f lavfi -i "anullsrc=r=48000:cl=stereo"             -map 0:v:0 -map 1:a:0 -t 90             -c:a aac -b:a 96k freedom_guide_latest.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 freedom_guide_latest.mp4
      - name: Publish first 6 only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom_guide_latest.mp4
          git commit -m "Keep post-install steps 7 8 9 out of installation video" || exit 0
          git push
