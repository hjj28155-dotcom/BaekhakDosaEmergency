name: Verify canonical Freedom seven-stage public installation
on:
  push:
    branches: [main]
    paths:
      - moveicon.html
      - update.html
      - .github/workflows/verify-freedom-seven-step-public.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seven_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify 1 2 3 6 7 stage logic, correct guide and Drive-only APK
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const html=fs.readFileSync('moveicon.html','utf8');
          assert.match(html,/freedom-flow-engine" content="FREEDOM-7STAGE-DRIVE-NO-DUPLICATE-20261026"/);
          for(let i=1;i<=7;i++)assert.ok(html.includes('data-step="'+i+'"'));
          assert.match(html,/id="freedomApkInstall"/);
          assert.match(html,/drive.google.com\/file\/d\/1-YadPjhG7J8cpA2-xFfi-WxjEVBvgEE5/);
          assert.match(html,/source src="\.\/freedom_onboarding_latest.mp4"/);
          assert.ok(!html.includes('Hanghae_MoveIcon_'));
          class E{
            constructor(id){this.id=id;this.hidden=true;this.listeners={};this.textContent='';this.currentTime=0;this.attrs={};this.classList={toggle(){}};this.count=0}
            addEventListener(n,f){this.listeners[n]=f}
            dispatch(n){if(this.listeners[n])this.listeners[n]()}
            setAttribute(k,v){this.attrs[k]=v}
            getAttribute(k){return this.attrs[k]}
            play(){this.count++;return Promise.resolve()}
            pause(){}
          }
          const ids=['scrollStage','videoStage','installStage','guideStage','homeStage','installVideo','afterApprovalVideo','guideStatus','videoStatus','startInstallVideo','replayVideo','openAfterApprovalGuide','replayAfterApproval','replayAfterApprovalFromHome'];
          const nodes=new Map(ids.map(id=>[id,new E(id)]));
          const stages=Array.from({length:7},(_,i)=>{let e=new E('step'+(i+1));e.attrs['data-step']=String(i+1);return e;});
          const document={getElementById(id){assert.ok(nodes.has(id),id);return nodes.get(id)},querySelectorAll(sel){assert.equal(sel,'.steps [data-step]');return stages}};
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];assert.equal(scripts.length,1);
          vm.runInNewContext(scripts[0][1],{document,window:{scrollTo(){}},console},{timeout:10000});
          function check(id,marker){assert.equal(nodes.get(id).hidden,false,id);assert.equal(stages[marker-1].attrs['aria-current'],'step',String(marker));}
          check('scrollStage',1);
          nodes.get('startInstallVideo').dispatch('click');check('videoStage',2);assert.equal(nodes.get('installStage').hidden,true);
          nodes.get('installVideo').dispatch('ended');check('installStage',3);
          nodes.get('openAfterApprovalGuide').dispatch('click');check('guideStage',6);assert.equal(nodes.get('afterApprovalVideo').count,1);
          nodes.get('afterApprovalVideo').dispatch('ended');check('homeStage',7);
          nodes.get('replayAfterApprovalFromHome').dispatch('click');check('guideStage',6);
          console.log('PASS: stages 1->2->3->6->7, Drive-only download, approved existing path skips duplicate APK install');
          NODE
      - name: Verify public canonical address has newly published page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://hjj28155-dotcom.github.io/BaekhakDosaEmergency/moveicon.html'
          ok=0
          for trial in $(seq 1 20); do
            curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$URL?drive_repaired=20261026-$trial" -o /tmp/live-seven-stage.html || true
            if grep -q 'FREEDOM-7STAGE-DRIVE-NO-DUPLICATE-20261026' /tmp/live-seven-stage.html && grep -q '1-YadPjhG7J8cpA2-xFfi-WxjEVBvgEE5' /tmp/live-seven-stage.html; then ok=1;break;fi
            sleep 8
          done
          test "$ok" = 1
          ! grep -q 'Hanghae_MoveIcon_' /tmp/live-seven-stage.html
          ! grep -q '다운로드 중지' /tmp/live-seven-stage.html
          echo 'PASS: live canonical page has current Drive and no MoveIcon APK link'
