name: Publish verified OWNER R13 645 FINAL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-moveicon-owner-r13-final.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moveicon-owner-r13-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact signed APK parts from dedicated Drive transfer folder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          mkdir -p /tmp/owner-r13
          cd /tmp/owner-r13
          gdown 'https://drive.google.com/uc?id=1TDAIRk6Ro03kqRatZ5_qYtLhS14SvuFj' -O part01
          gdown 'https://drive.google.com/uc?id=1rZXFwS7XqYUHqSEQCSa8RMI2JvOQ7anF' -O part02
          gdown 'https://drive.google.com/uc?id=1hx7j-243aHSr3rGU4FuN5rXAr3ixMq3T' -O part03
          gdown 'https://drive.google.com/uc?id=1w6TIuNNV_Mq7HWzIW9g_FmkqIaW8MWC7' -O part04
          sha256sum -c <<'HASHES'
          9d2b2d77c63194b016da46a175c511cc656185b2d998ec4205fdae1b0def42ad  part01
          5f2648ee45bc578632f5c3f02ee2cc3b1d909633e21b9c3731c7d98c1adfd3a0  part02
          3861a83b5f218a94c3eb2ae09e767db811cdf8adac4f959d34d53bbf6a02ec19  part03
          2faabf54e1dd8f940d581072f4ee023c076b9efbfd3e75446cf34c725500de60  part04
          HASHES
          cat part01 part02 part03 part04 > MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk
          APK=MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk
          test "$(stat -c%s "$APK")" = 148787966
          echo "b85756a5911047d204e0b0e9b2b9bf2e538d6595e32d416fa29f666512fd164b  $APK" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk') as z:
              assert z.testzip() is None
          PY
      - name: Verify Android package, version and existing OWNER signing certificate
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" 'build-tools;36.0.0'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=/tmp/owner-r13/MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/owner-r13/signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 2716bfb38ed089c8a039d73be92db5000ddaf85b70f0e5d8689bd537da303b3e' /tmp/owner-r13/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/owner-r13/signature.txt
          "$BT/aapt" dump badging "$APK" > /tmp/owner-r13/badging.txt
          grep -q "package: name='com.navigator.freedom.moveicon.owner' versionCode='1100013' versionName='1.1.12-OWNER'" /tmp/owner-r13/badging.txt
      - name: Publish exact verified R13 and test anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=moveicon-owner-r13-v1.1.12
          APK=/tmp/owner-r13/MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'MoveIcon OWNER R13 1.1.12 — 645 FINAL' --notes 'Exact verified permanent OWNER signed APK, embedded LOTTO645 R678 (71700). Android device execution test pending. R12 and legacy public channel preserved.' --latest=false
          fi
          curl -fL --retry 5 --retry-delay 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk" -o /tmp/owner-r13/recheck.apk
          echo 'b85756a5911047d204e0b0e9b2b9bf2e538d6595e32d416fa29f666512fd164b  /tmp/owner-r13/recheck.apk' | sha256sum -c -
      - name: Activate OWNER R13 only after successful download verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          m=Path('moveicon-owner-release.json')
          p=Path('moveicon-download.html')
          j=json.loads(m.read_text())
          if j.get('versionCode') not in (1100012,1100013): raise SystemExit('Unexpected or newer OWNER version; preserve it')
          if j.get('versionCode')==1100013 and j.get('sha256')!='b85756a5911047d204e0b0e9b2b9bf2e538d6595e32d416fa29f666512fd164b': raise SystemExit('Conflicting R13 release')
          url='https://github.com/hjj28155-dotcom/BaekhakDosaEmergency/releases/download/moveicon-owner-r13-v1.1.12/MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk'
          s=p.read_text()
          if 'id="moveicon-owner-r12"' in s:
              start=s.index('<section id="moveicon-owner-r12"')
              end=s.index('</section>',start)+len('</section>')
              owner=s[start:end]
              owner=re.sub(r'<div id="r13-publication-pending"[\s\S]*?</div>','',owner)
              owner=owner.replace('moveicon-owner-r12','moveicon-owner-r13').replace('R12','R13').replace('1.1.11','1.1.12')
              owner=owner.replace('자동 버전 확인판','645 FINAL 내장판')
              owner=owner.replace('MoveIcon_OWNER_R13_1.1.12_SIGNED.apk','MoveIcon_OWNER_R13_1.1.12_645_FINAL_SIGNED.apk')
              owner=re.sub(r'(<a id="moveicon-owner-apk"[^>]*href=")[^"]+(")',lambda x:x.group(1)+url+x.group(2),owner)
              owner=re.sub(r'<div id="owner-download-fallback"[\s\S]*?</div>','',owner)
              owner=owner.replace('구글 드라이브에서 APK를 다운로드한 뒤 설치 또는 업데이트를 누르세요. Google 드라이브의 파일 검사 안내가 뜨면 내용을 확인하고 다운로드를 계속하세요.','공식 서명 APK를 다운로드한 뒤 설치 또는 업데이트를 누르세요.')
              owner=owner.replace('48.76 MB','148.79 MB').replace('2026-11-15','2026-11-16')
              owner=owner.replace('645 앱은 별도 설치 앱입니다. 현재 645 설치 링크는 차단 상태입니다.','645 FINAL R678 내장판입니다. 별도 645 앱이 없는 기기에서도 내장 실행을 지원합니다. 실기기 실행 검증은 아직 완료되지 않았습니다.')
              s=s[:start]+owner+s[end:]
              p.write_text(s)
          elif 'id="moveicon-owner-r13"' not in s: raise SystemExit('Unexpected download page')
          j.update(versionName='1.1.12-OWNER',versionCode=1100013,release='R13',apkUrl=url,fallbackUrl=url,sha256='b85756a5911047d204e0b0e9b2b9bf2e538d6595e32d416fa29f666512fd164b',sizeBytes=148787966,deviceTested=False)
          m.write_text(json.dumps(j,indent=2)+'\n')
          PY
          git add moveicon-download.html moveicon-owner-release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Activate verified MoveIcon OWNER R13 645 FINAL release'
          git push origin HEAD:main
