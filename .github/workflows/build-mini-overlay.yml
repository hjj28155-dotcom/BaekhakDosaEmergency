name: Build Mini Overlay APK
on:
  push:
    paths:
      - 'mini-overlay/**'
      - '.github/workflows/build-mini-overlay.yml'
permissions:
  contents: write
concurrency:
  group: mini-overlay-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Persist Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hanghae-mini-stable-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Hanghae Freedom Mini Stable Debug,O=Hanghae,C=KR"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build APK
        working-directory: mini-overlay
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        run: |
          set -euo pipefail
          APK=$(find mini-overlay/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git add HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git commit -m 'Publish mini overlay APK' || true
          git pull --rebase origin main
          git push
