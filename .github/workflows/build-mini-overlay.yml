name: Build Mini Overlay APK
on:
  push:
    paths:
      - 'mini-overlay/**'
      - '.github/workflows/build-mini-overlay.yml'
permissions:
  contents: write
concurrency:
  group: mini-overlay-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Persist Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hanghae-mini-stable-debug-keystore-v1-20261004-094344
      - name: Restore original navigator signing key
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          curl -fL --retry 3 -o /tmp/original.apk 'https://raw.githubusercontent.com/hjj28155-dotcom/BaekhakDosaEmergency/3f4f4659b0b55525ca642c609ba65468804d5b22/HANGHAE_NAVIGATOR_MINI-v1.0.18.apk'
          unzip -p /tmp/original.apk META-INF/CERT.RSA >/tmp/original-cert.rsa
          # Fail visibly if cached key is not the key that signed the known-good v1.0.18.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -q '52:9D:6C:AF:D8:51:EC:ED:06:6C:AD:3C:54:19:BA:00:A2:C6:DD:AF:C6:04:0A:46:B8:81:49:79:4F:41:4F:77' || rm -f ~/.android/debug.keystore
          fi
          if [ ! -f ~/.android/debug.keystore ]; then
            echo 'Original signing key is not available in cache; refusing to publish an incompatible update.'
            exit 1
          fi
      - name: Build both APK editions
        working-directory: mini-overlay
        run: |
          set -euo pipefail
          gradle assembleDistributionDebug assembleNavigatorDebug assembleBridgeDebug --no-daemon
      - name: Verify distribution update compatibility against original v1.0.16
        if: ${{ false }}
        working-directory: .
        run: |
          set -euo pipefail
          OLD=/tmp/HANGHAE_MINI_ORIGINAL_V1_0_16.apk
          curl -fL --retry 3 -o "$OLD" "https://raw.githubusercontent.com/hjj28155-dotcom/BaekhakDosaEmergency/a0d59b6204c3137670c6025d87bff6537fcc1680/HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk"
          DIST=$(find mini-overlay/app/build/outputs/apk/distribution/debug -type f -name '*.apk' | head -1)
          test -s "$OLD"
          test -s "$DIST"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo '=== ORIGINAL DISTRIBUTION BADGING ==='
          "$AAPT" dump badging "$OLD" | head -5
          echo '=== NEW DISTRIBUTION BADGING ==='
          "$AAPT" dump badging "$DIST" | head -5
          echo '=== ORIGINAL DISTRIBUTION CERT ==='
          "$APKSIGNER" verify --print-certs "$OLD"
          echo '=== NEW DISTRIBUTION CERT ==='
          "$APKSIGNER" verify --print-certs "$DIST"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$DIST" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | head -1)
          OLD_PKG=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          NEW_PKG=$("$AAPT" dump badging "$DIST" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          OLD_VER=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" | head -1)
          NEW_VER=$("$AAPT" dump badging "$DIST" | sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" | head -1)
          echo "OLD_CERT=$OLD_CERT"
          echo "NEW_CERT=$NEW_CERT"
          echo "OLD_PKG=$OLD_PKG"
          echo "NEW_PKG=$NEW_PKG"
          echo "OLD_VER=$OLD_VER"
          echo "NEW_VER=$NEW_VER"
          test -n "$OLD_CERT"
          test -n "$NEW_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          test "$OLD_PKG" = "$NEW_PKG"
          test "$NEW_VER" -gt "$OLD_VER"

      - name: Publish both APK editions
        run: |
          set -euo pipefail
          DIST=$(find mini-overlay/app/build/outputs/apk/distribution/debug -type f -name '*.apk' | head -1)
          NAV=$(find mini-overlay/app/build/outputs/apk/navigator/debug -type f -name '*.apk' | head -1)
          BRIDGE=$(find mini-overlay/app/build/outputs/apk/bridge/debug -type f -name '*.apk' | head -1)
          test -s "$DIST"
          test -s "$NAV"
          test -s "$BRIDGE"

          # Refresh tracked branch BEFORE copying binary outputs.
          # Built APKs live under ignored build/ paths, so reset does not remove them.
          git fetch origin main
          git reset --hard origin/main

          cp "$DIST" HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk
          cp "$DIST" '항행의자유_배포용_이동아이콘.apk'
          cp "$NAV" HANGHAE_NAVIGATOR_MINI-debug.apk
          cp "$NAV" HANGHAE_NAVIGATOR_MINI-v1.0.18.apk
          cp "$NAV" '항해사_전용_이동아이콘.apk'
          cp "$NAV" '항해사_전용_이동아이콘_v1.0.18.apk'
          cp "$BRIDGE" HANGHAE_MOVEICON_V1.0.18_BRIDGE.apk
          cp "$BRIDGE" '항행의자유_이동아이콘_v1.0.18_교체판.apk'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk HANGHAE_NAVIGATOR_MINI-debug.apk HANGHAE_NAVIGATOR_MINI-v1.0.18.apk HANGHAE_MOVEICON_V1.0.18_BRIDGE.apk '항행의자유_배포용_이동아이콘.apk' '항해사_전용_이동아이콘.apk' '항해사_전용_이동아이콘_v1.0.18.apk' '항행의자유_이동아이콘_v1.0.18_교체판.apk'
          git commit -m 'Publish move icon v1.0.18 APKs' || exit 0
          git push origin HEAD:main
