name: Build Mini Overlay APK
on:
  push:
    paths:
      - 'mini-overlay/**'
      - '.github/workflows/build-mini-overlay.yml'
permissions:
  contents: write
concurrency:
  group: mini-overlay-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Persist Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hanghae-mini-stable-debug-keystore-v1
      - name: Ensure stable debug signing key exists
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Hanghae Freedom Mini Stable Debug,O=Hanghae,C=KR"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build both APK editions
        working-directory: mini-overlay
        run: |
          set -euo pipefail
          gradle assembleDistributionDebug assembleNavigatorDebug assembleBridgeDebug --no-daemon
      - name: Verify update compatibility against original v1.0.16
        working-directory: .
        run: |
          set -euo pipefail
          OLD=/tmp/HANGHAE_NAVIGATOR_MINI-v1.0.16-original.apk
          git show a0d59b6204c3137670c6025d87bff6537fcc1680:HANGHAE_NAVIGATOR_MINI-v1.0.16.apk > "$OLD"
          NAV=$(find mini-overlay/app/build/outputs/apk/navigator/debug -type f -name '*.apk' | head -1)
          test -s "$OLD"
          test -s "$NAV"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo '=== ORIGINAL V1.0.16 BADGING ==='
          "$AAPT" dump badging "$OLD" | head -5
          echo '=== NEW V1.0.18 BADGING ==='
          "$AAPT" dump badging "$NAV" | head -5
          echo '=== ORIGINAL V1.0.16 CERT ==='
          "$APKSIGNER" verify --print-certs "$OLD"
          echo '=== NEW V1.0.18 CERT ==='
          "$APKSIGNER" verify --print-certs "$NAV"
          OLD_CERT=$("$APKSIGNER" verify --print-certs "$OLD" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$NAV" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          OLD_PKG=$("$AAPT" dump badging "$OLD" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          NEW_PKG=$("$AAPT" dump badging "$NAV" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          echo "OLD_CERT=$OLD_CERT"
          echo "NEW_CERT=$NEW_CERT"
          echo "OLD_PKG=$OLD_PKG"
          echo "NEW_PKG=$NEW_PKG"
          test "$OLD_CERT" = "$NEW_CERT"
          test "$OLD_PKG" = "$NEW_PKG"

      - name: Publish both APK editions
        run: |
          set -euo pipefail
          DIST=$(find mini-overlay/app/build/outputs/apk/distribution/debug -type f -name '*.apk' | head -1)
          NAV=$(find mini-overlay/app/build/outputs/apk/navigator/debug -type f -name '*.apk' | head -1)
          BRIDGE=$(find mini-overlay/app/build/outputs/apk/bridge/debug -type f -name '*.apk' | head -1)
          test -s "$DIST"
          test -s "$NAV"
          test -s "$BRIDGE"

          # Refresh tracked branch BEFORE copying binary outputs.
          # Built APKs live under ignored build/ paths, so reset does not remove them.
          git fetch origin main
          git reset --hard origin/main

          cp "$DIST" HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk
          cp "$DIST" '항행의자유_배포용_이동아이콘.apk'
          cp "$NAV" HANGHAE_NAVIGATOR_MINI-debug.apk
          cp "$NAV" HANGHAE_NAVIGATOR_MINI-v1.0.18.apk
          cp "$NAV" '항해사_전용_이동아이콘.apk'
          cp "$NAV" '항해사_전용_이동아이콘_v1.0.18.apk'
          cp "$BRIDGE" HANGHAE_MOVEICON_V1.0.18_BRIDGE.apk
          cp "$BRIDGE" '항행의자유_이동아이콘_v1.0.18_교체판.apk'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk HANGHAE_NAVIGATOR_MINI-debug.apk HANGHAE_NAVIGATOR_MINI-v1.0.18.apk HANGHAE_MOVEICON_V1.0.18_BRIDGE.apk '항행의자유_배포용_이동아이콘.apk' '항해사_전용_이동아이콘.apk' '항해사_전용_이동아이콘_v1.0.18.apk' '항행의자유_이동아이콘_v1.0.18_교체판.apk'
          git commit -m 'Publish move icon v1.0.18 APKs' || exit 0
          git push origin HEAD:main
