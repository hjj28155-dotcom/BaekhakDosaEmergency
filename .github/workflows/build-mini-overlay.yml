name: Build Mini Overlay APK
on:
  push:
    paths:
      - 'mini-overlay/**'
      - '.github/workflows/build-mini-overlay.yml'
permissions:
  contents: write
concurrency:
  group: mini-overlay-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: mini-overlay
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        run: |
          set -euo pipefail
          APK=$(find mini-overlay/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git add HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git commit -m 'Publish mini overlay APK' || true
          git pull --rebase origin main
          git push
