name: Publish FIX19 from Drive
on:
  push:
    paths:
      - '.github/workflows/publish-fix19-drive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: python -m pip install --quiet gdown
      - name: Download APK from Drive
        run: |
          gdown --id 1vUVD4BY9NRcqoCGDED8iuuhUpDNOnJ9V -O FreedomV3_V1_DirectUpdate_FIX19-debug.apk
          test "$(stat -c%s FreedomV3_V1_DirectUpdate_FIX19-debug.apk)" -gt 12000000
      - name: Publish APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FreedomV3_V1_DirectUpdate_FIX19-debug.apk
          git commit -m 'Publish FIX19 30103 APK' || exit 0
          git push
