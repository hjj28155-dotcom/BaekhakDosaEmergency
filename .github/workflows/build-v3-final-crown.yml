name: Build Freedom V3 Final Crown Approval Restored
on:
  push:
    paths:
      - '.github/workflows/build-v3-final-crown.yml'
      - 'build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/index.html'
      - 'build405/FREEDOM_V402_BUILD_THIS/app/build.gradle'
      - 'build405/FREEDOM_V402_BUILD_THIS/app/src/main/java/com/baekhak/centralcontrol/MainActivity.java'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build V3 final crown approval-restored APK
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name 'HANGHAE_FREEDOM_V4_0_28_APPROVAL_FALLBACK_R7-debug.apk' | head -1)
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/항행의자유_V4.0.28_승인요청복구_R7.apk"
          sha256sum "$GITHUB_WORKSPACE/항행의자유_V4.0.28_승인요청복구_R7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE_FREEDOM_V4_0_28_APPROVAL_FALLBACK_R7
          path: 항행의자유_V4.0.28_승인요청복구_R7.apk
          if-no-files-found: error
      - name: Publish direct APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "항행의자유_V4.0.28_승인요청복구_R7.apk"
          git commit -m "Publish Freedom V3 update stats fix APK" || exit 0
          git reset --hard HEAD
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 2
          done
          test "$pushed" = "1"
