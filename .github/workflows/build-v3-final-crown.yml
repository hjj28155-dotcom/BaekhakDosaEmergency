name: Build Freedom V3 Final Crown No Approval
on:
  push:
    paths:
      - '.github/workflows/build-v3-final-crown.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build V3 final crown no-approval APK
        working-directory: build405/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name 'HANGHAE_FREEDOM_V3_FINAL_CROWN_20261002-debug.apk' | head -1)
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/항행의자유_왕관앱_V3_완성본_20261002.apk"
          sha256sum "$GITHUB_WORKSPACE/항행의자유_왕관앱_V3_완성본_20261002.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE_FREEDOM_V3_FINAL_CROWN_20261002
          path: 항행의자유_왕관앱_V3_완성본_20261002.apk
          if-no-files-found: error
      - name: Publish direct APK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "항행의자유_왕관앱_V3_완성본_20261002.apk"
          git commit -m "Publish Freedom V3 final crown APK" || exit 0
          git pull --rebase origin main
          git push origin main
