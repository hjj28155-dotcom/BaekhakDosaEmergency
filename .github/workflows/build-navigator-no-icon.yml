name: Build Navigator Link Update No Icon
on:
  push:
    paths:
      - '.github/workflows/build-navigator-no-icon.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download navigator source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2594-8206-bd96-e6ebe95233ae/raw?se=2026-10-01T02%3A50%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=9b0fdbf3-e06c-5feb-a918-1f47154f95bd&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T02%3A26%3A33Z&ske=2026-10-02T02%3A26%3A33Z&sks=b&skv=2026-02-06&sig=OFDWEO6KKmH29tNOCqEkUIoi4CKd9gcqi%2BxiPtbsX08%3D' -o navigator.zip
          rm -rf navigator
          mkdir navigator
          unzip -q navigator.zip -d navigator
          test -f navigator/V3_PERPECT_SUCCESS_MUSIC_FIX9/app/src/master/assets/index.html
      - name: Patch visible link update button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('navigator/V3_PERPECT_SUCCESS_MUSIC_FIX9')
          h=root/'app/src/master/assets/index.html'
          s=h.read_text(encoding='utf-8')
          old='<button class="auxAction" onclick="openM(\'update\')">↻ 앱 업데이트</button>'
          new='<button class="auxAction gold" onclick="try{AndroidHost.openNavigatorUpdateLink()}catch(e){alert(\'업데이트 링크를 열 수 없습니다.\')}">↻ 항해사앱 업데이트</button>'
          if old not in s: raise SystemExit('home update button not found')
          s=s.replace(old,new,1)
          s=s.replace('V3.0.80 · MASTER FIX8 승인 유지 · 음악 FIX9','V3.0.83 · 서버승인 유지 · 이동아이콘 없음 · 링크 업데이트')
          h.write_text(s,encoding='utf-8')
          j=root/'app/src/main/java/com/baekhak/centralcontrol/MainActivity.java'
          t=j.read_text(encoding='utf-8')
          needle='        @JavascriptInterface public void chooseApkUpdate() { chooseApkUpdateFile(); }'
          insert='        @JavascriptInterface public void chooseApkUpdate() { chooseApkUpdateFile(); }\n        @JavascriptInterface public void openNavigatorUpdateLink() {\n            runOnUiThread(() -> {\n                try {\n                    Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("https://hjj28155-dotcom.github.io/BaekhakDosaEmergency/navigator-update.html"));\n                    i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n                    startActivity(i);\n                } catch (Exception e) {\n                    Toast.makeText(this, "업데이트 링크를 열지 못했습니다.", Toast.LENGTH_LONG).show();\n                }\n            });\n        }'
          if needle not in t: raise SystemExit('bridge insertion point not found')
          t=t.replace(needle,insert,1)
          j.write_text(t,encoding='utf-8')
          g=root/'app/build.gradle'
          b=g.read_text(encoding='utf-8')
          b=b.replace("versionCode 30080","versionCode 30083")
          b=b.replace("versionName 'V3.0.80-MASTER-MUSIC-FIX9-20260925'","versionName 'V3.0.83-MASTER-LINK-UPDATE-NO-ICON-20261001'")
          g.write_text(b,encoding='utf-8')
          PY
      - name: Verify no floating icon
        run: |
          set -euo pipefail
          cd navigator/V3_PERPECT_SUCCESS_MUSIC_FIX9
          ! grep -R "SYSTEM_ALERT_WINDOW" app/src/master app/src/main/AndroidManifest.xml
          ! grep -R "OverlayControlService" app/src/master app/src/main
          ! grep -R "OverlayBootReceiver" app/src/master app/src/main
      - name: Build navigator APK
        working-directory: navigator/V3_PERPECT_SUCCESS_MUSIC_FIX9
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleMasterDebug --no-daemon
          APK=$(find app/build/outputs/apk/master/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/항해사앱_링크업데이트_이동아이콘없음_최종.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: navigator-link-update-no-icon
          path: 항해사앱_링크업데이트_이동아이콘없음_최종.apk
          if-no-files-found: error
          retention-days: 1
