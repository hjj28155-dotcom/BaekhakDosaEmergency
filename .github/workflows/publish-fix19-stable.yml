name: Publish FIX19 stable
on:
  push:
    paths:
      - '.github/workflows/publish-fix19-stable.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        env:
          SRC_B64: 
        run: |
          set -euo pipefail
          SRC=$(printf '%s' "$SRC_B64" | base64 -d)
          curl -fL "$SRC" -o FreedomV3_V1_DirectUpdate_FIX19-debug.apk
          test "$(stat -c%s FreedomV3_V1_DirectUpdate_FIX19-debug.apk)" -gt 12000000
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FreedomV3_V1_DirectUpdate_FIX19-debug.apk
          git commit -m 'Publish stable FIX19 APK' || exit 0
          git push
