name: Build isolated crew meeting pilot APK
on:
  push:
    branches:
      - feature/crew-meeting-standalone-apk-20261025
    paths:
      - 'crew-meeting-android/**'
      - '.github/workflows/build-crew-meeting-apk.yml'
permissions:
  contents: write
concurrency:
  group: crew-meeting-pilot-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Restore isolated pilot signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crew-meeting-independent-pilot-signing-v1
      - name: Diagnose Android debug signing source (public metadata only)
        working-directory: crew-meeting-android
        run: |
          set -euo pipefail
          gradle :app:signingReport --no-daemon 2>&1 | grep -E "^(Variant:|Config:|Store:|Alias:|SHA-256:|SHA256:|Valid until:)" || true
      - name: Abort if original signing key is missing
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "Original signing key missing: STOP; do not generate a replacement."; exit 1; }
          ACTUAL=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ { print $2 }')
          echo "Restored signing certificate SHA256: $ACTUAL"
          test "$ACTUAL" = "B5:77:03:8A:98:E7:C5:B4:0E:13:75:00:06:88:52:18:2E:3D:AA:6E:A7:2B:74:97:77:4D:83:63:88:4F:BD:2C" || { echo "Unexpected signing key: STOP"; exit 1; }
      - name: Assemble separate app
        working-directory: crew-meeting-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate standalone APK and emit sha256
        run: |
          set -euo pipefail
          APK=crew-meeting-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/crew-apk-signer.log
          OLD=crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.0.apk
          test -s "$OLD"
          "$APKSIGNER" verify --verbose --print-certs "$OLD" > /tmp/crew-old-signer.log
          OLD_CERT=$(sed -n "s/^V2 Signer: certificate SHA-256 digest: //p" /tmp/crew-old-signer.log | head -1)
          NEW_CERT=$(sed -n "s/^V2 Signer: certificate SHA-256 digest: //p" /tmp/crew-apk-signer.log | head -1)
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          test "$NEW_CERT" = "b577038a98e7c5b40e137500068852182e3daa6ea72b7497774d8363884fbd2c"
          echo "Same signing certificate verified for update: $NEW_CERT"
          "$AAPT" dump badging "$APK" | head -5
          "$AAPT" dump badging "$APK" | grep -q "package: name='kr.hanghae.crewmeeting' versionCode='101'"
          ! "$AAPT" dump badging "$APK" | grep -q "package: name='com.baekhak.dosa.v4'"
          mkdir -p crew-meeting-android/releases
          cp "$APK" crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.1.apk
          (cd crew-meeting-android/releases && sha256sum CREW_MEETING_PILOT_1.0.1.apk > CREW_MEETING_PILOT_1.0.1.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: CREW-MEETING-PILOT-1.0.1-APK
          path: |
            crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.1.apk
            crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.1.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish only this isolated pilot to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.1.apk crew-meeting-android/releases/CREW_MEETING_PILOT_1.0.1.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Build isolated crew meeting PILOT APK (no V3/V7 changes)'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
