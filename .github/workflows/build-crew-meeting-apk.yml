name: Build same-signer captain V4 original 5x2 research APK v1.0.16
on:
  push:
    branches:
      - feature/captain-v116-v4-two-original-packs-20261028
    paths:
      - 'crew-meeting-android/**'
      - '.github/workflows/build-crew-meeting-apk.yml'
  pull_request:
    branches:
      - feature/crew-meeting-standalone-apk-20261025
    paths:
      - 'crew-meeting-android/**'
      - '.github/workflows/build-crew-meeting-apk.yml'
permissions:
  contents: write
concurrency:
  group: crew-meeting-pilot-apk-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Restore isolated pilot signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crew-meeting-independent-pilot-signing-v1
          fail-on-cache-miss: true
      - name: Abort if original signing key is missing
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "Original signing key missing: STOP; do not generate a replacement."; exit 1; }
          ACTUAL=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ { print $2 }')
          echo "Restored signing certificate SHA256: $ACTUAL"
          test "$ACTUAL" = "E2:4E:95:73:E5:E9:85:67:EA:2E:5A:BD:DA:C4:27:12:6C:43:D8:F1:E4:6B:37:E4:09:9D:AB:C9:11:CF:70:BE" || { echo "Unexpected signing key: STOP"; exit 1; }
      - name: Verify bundled six-room captain research dashboard is present
        run: |
          set -euo pipefail
          HOME_HTML=crew-meeting-android/app/src/main/assets/captain_home_v114.html
          test -s "$HOME_HTML"
          grep -Fq 'id="appCommandDeck"' "$HOME_HTML"
          grep -Fq 'id="beforeRoomGrid"' "$HOME_HTML"
          grep -Fq 'id="homeApprovalBtn"' "$HOME_HTML"
          grep -Fq 'id="homeV3RoomsPanel"' "$HOME_HTML"
          grep -Fq 'id="openV3Rooms"' "$HOME_HTML"
          grep -Fq 'data-v3-room-card="v3-4"' "$HOME_HTML"
          grep -Fq 'data-v3-report="v3-1"' "$HOME_HTML"
          grep -Fq 'data-material-stage="after"' "$HOME_HTML"
          grep -Fq '기존 누적 350회' "$HOME_HTML"
          grep -Fq 'loadCaptainDashboard()' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq "versionCode 116" crew-meeting-android/app/build.gradle
          test "$(grep -c 'data-before-room=' "$HOME_HTML")" -eq 7
          test "$(grep -c 'data-v3-room-card=' "$HOME_HTML")" -eq 4
          test "$(grep -c 'data-v3-report=' "$HOME_HTML")" -eq 4
          echo 'Embedded captain-only report-before and report-after modules: present'
      - name: Verify V4 original engine chunks equal preserved source exactly
        run: |
          set -euo pipefail
          ROOT=crew-meeting-android/app/src/main/assets
          ORIGINAL=build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/engine_v2.html
          test -s "$ORIGINAL"
          test "$(find "$ROOT" -maxdepth 1 -name 'v4_engine116_part_*.chunk' | wc -l)" -eq 19
          cat "$ROOT"/v4_engine116_part_*.chunk | cmp -s - "$ORIGINAL"
          grep -Fq 'V3_ENGINE_READY' "$ORIGINAL"
          grep -Fq 'V3_ANALYSIS_RESULT' "$ORIGINAL"
          grep -Fq 'id="homeV4AnalysisPanel"' "$ROOT/captain_home_v114.html"
          grep -Fq 'id="v4RunTwoPack"' "$ROOT/captain_home_v114.html"
          grep -Fq 'id="v4PackA"' "$ROOT/captain_home_v114.html"
          grep -Fq 'id="v4PackB"' "$ROOT/captain_home_v114.html"
          grep -Fq 'v4CandidatePack' "$ROOT/captain_home_v114.html"
          echo 'V4 original engine 19 segments identical to preserved source; both 5-game panels present.'
      - name: Assemble separate app
        working-directory: crew-meeting-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate standalone APK and emit sha256
        run: |
          set -euo pipefail
          APK=crew-meeting-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/crew-apk-signer.log
          NEW_CERT=$(sed -n "s/^V2 Signer: certificate SHA-256 digest: //p" /tmp/crew-apk-signer.log | head -1)
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "e24e9573e5e98567ea2e5abddac427126c43d8f1e46b37e4099dabc911cf70be"
          echo "Recovery app signer pinned: $NEW_CERT"
          "$AAPT" dump badging "$APK" | head -5
          "$AAPT" dump badging "$APK" | grep -q "package: name='kr.hanghae.crewmeeting.compact' versionCode='116'"
          ! "$AAPT" dump badging "$APK" | grep -q "package: name='com.baekhak.dosa.v4'"
          mkdir -p crew-meeting-android/releases
          cp "$APK" crew-meeting-android/releases/HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk
          (cd crew-meeting-android/releases && sha256sum HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk > HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE-CREW-MEETING-1.0.16-V4-5X2-TEST-APK
          path: |
            crew-meeting-android/releases/HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk
            crew-meeting-android/releases/HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Verify isolated APK artifact packaging
        run: |
          set -euo pipefail
          test -s crew-meeting-android/releases/HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk
          test -s crew-meeting-android/releases/HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk.sha256
          (cd crew-meeting-android/releases && sha256sum --check HANGHAE_CREW_MEETING_1.0.16_V4_5X2_TEST.apk.sha256)
          echo "TEST artifact verified. Do NOT replace the stable fixed Google Drive APK without device verification."
