name: Build same-signer V8.0.7 analysis-distribution staging APK
on:
  push:
    branches:
      - feature/crew-meeting-standalone-apk-20261025
      - feature/v8-v7-retirement-v3-link-20261029
    paths:
      - 'crew-meeting-android/**'
      - '.github/workflows/build-crew-meeting-apk.yml'
  pull_request:
    branches:
      - feature/crew-meeting-standalone-apk-20261025
    paths:
      - 'crew-meeting-android/**'
      - '.github/workflows/build-crew-meeting-apk.yml'
permissions:
  contents: write
concurrency:
  group: crew-meeting-pilot-apk-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Restore isolated pilot signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: crew-meeting-independent-pilot-signing-v1
          fail-on-cache-miss: true
      - name: Abort if original signing key is missing
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore" || { echo "Original signing key missing: STOP; do not generate a replacement."; exit 1; }
          ACTUAL=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/ { print $2 }')
          echo "Restored signing certificate SHA256: $ACTUAL"
          test "$ACTUAL" = "E2:4E:95:73:E5:E9:85:67:EA:2E:5A:BD:DA:C4:27:12:6C:43:D8:F1:E4:6B:37:E4:09:9D:AB:C9:11:CF:70:BE" || { echo "Unexpected signing key: STOP"; exit 1; }
      - name: Assemble offline R46 captain and independent R1 liaison engines
        run: |
          set -euo pipefail
          BASE=build405/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/engine_v2.html
          DEST=crew-meeting-android/app/src/main/assets/captain_engine_r46.html
          test -s "$BASE"
          test "$(sha256sum "$BASE" | cut -d' ' -f1)" = "5519b83b9a31095a70db8efee91b502a4ce65aa02ba9c0b9727575a2f16504d9"
          base64 -d crew-meeting-android/patches/captain_r46.patch.gz.b64 | gzip -d > /tmp/captain_r46.patch
          patch --batch -o "$DEST" "$BASE" /tmp/captain_r46.patch
          test "$(sha256sum "$DEST" | cut -d' ' -f1)" = "b40c756387dd56e38b0e4119b96da7903d53fe556acceb2184309b9b33d17f46"
          cp crew-meeting-android/research-engines/liaison-blind-engine.mjs crew-meeting-android/app/src/main/assets/liaison-blind-engine.mjs
          cp crew-meeting-android/research-engines/v7-engine100-baseline.mjs crew-meeting-android/app/src/main/assets/v7-engine100-baseline.mjs
          node --check crew-meeting-android/research-engines/liaison-blind-engine.mjs
          node --check crew-meeting-android/research-engines/v7-engine100-baseline.mjs
          python3 - <<'PY'
          import json,hashlib
          p='crew-meeting-android/app/src/main/assets/db1_rounds_1_1247.json'
          data=json.load(open(p))
          assert data['count']==1247 and len(data['rows'])==1247
          for i,row in enumerate(data['rows'],1):
              assert row['round_no']==i
              assert len(row['source_text'].splitlines())==6
              assert hashlib.sha256(row['source_text'].encode()).hexdigest()==row['source_sha256']
          print('APK DB-1 original 1247 rounds / 7482 clue lines / SHA-256: PASS')
          PY
      - name: Verify bundled six-room captain research dashboard is present
        run: |
          set -euo pipefail
          set -x
          HOME_HTML=crew-meeting-android/app/src/main/assets/captain_home_v114.html
          test -s "$HOME_HTML"
          grep -Fq 'id="appCommandDeck"' "$HOME_HTML"
          grep -Fq 'id="beforeRoomGrid"' "$HOME_HTML"
          grep -Fq 'id="homeApprovalBtn"' "$HOME_HTML"
          grep -Fq 'id="homeV3RoomsPanel"' "$HOME_HTML"
          grep -Fq 'id="openV3Rooms"' "$HOME_HTML"
          grep -Fq 'id="openFreedomAnalysis"' "$HOME_HTML"
          grep -Fq 'id="freedomAnalysisPanel"' "$HOME_HTML"
          grep -Fq 'id="freedomFirstFive"' "$HOME_HTML"
          grep -Fq 'id="freedomSecondFive"' "$HOME_HTML"
          grep -Fq 'id="freedomResetActive"' "$HOME_HTML"
          grep -Fq 'id="freedomCaptainStatus"' "$HOME_HTML"
          grep -Fq 'id="freedomLiaisonStatus"' "$HOME_HTML"
          grep -Fq 'id="freedomPngPreview"' "$HOME_HTML"
          grep -Fq 'id="freedomRoomArchive"' "$HOME_HTML"
          grep -Fq 'id="freedomArchiveCentral"' "$HOME_HTML"
          grep -Fq 'id="freedomArchiveBack"' "$HOME_HTML"
          grep -Fq 'id="freedomArchiveBadge"' "$HOME_HTML"
          grep -Fq 'captainV4RestoreArchive=restoreArchivedRound' "$HOME_HTML"
          grep -Fq 'captain-v4-archive-saved' "$HOME_HTML"
          grep -Fq 'captain-v4-archived' "$HOME_HTML"
          grep -Fq 'captain-v4-archived' crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq 'INDEPENDENT_SOURCE_ATTESTED' "$HOME_HTML"
          grep -Fq "V4 '+found+'/2방 실제 원본" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq 'captainEngineRoundSave=async function' "$HOME_HTML"
          grep -Fq 'captainEngineRoundRead=async function' "$HOME_HTML"
          grep -Fq 'crew-verified-round-results' "$HOME_HTML"
          grep -Fq 'id="cumV7ArchiveReference"' "$HOME_HTML"
          grep -Fq 'archived_v7_captain_reference' crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq "V4 '+found+'/2방 실제 원본" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq 'id="freedomPngZoom"' "$HOME_HTML"
          grep -Fq "viewport.classList.toggle('zoomed')" crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq 'id="freedomSavePng"' "$HOME_HTML"
          grep -Fq 'id="freedomPngPanel"' "$HOME_HTML"
          grep -Fq '#freedomAnalysisPanel #freedomDbStatus,' "$HOME_HTML"
          grep -Fq '#freedomAnalysisPanel .v4DbOriginal,' "$HOME_HTML"
          grep -Fq '#freedomAnalysisPanel #freedomAnalysisStatus,' "$HOME_HTML"
          grep -Fq '#freedomAnalysisPanel #freedomTextBackup,' "$HOME_HTML"
          grep -Fq 'width:100%!important;height:auto!important' "$HOME_HTML"
          grep -Fq 'var W=960,H=1350,canvas' crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq '184+j*130,cy,accent' crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq 'id="freedomTextBackup"' "$HOME_HTML"
          grep -Fq 'crew-v4-png-report.js' "$HOME_HTML"
          grep -Fq 'captain-v4-verified' "$HOME_HTML"
          grep -Fq 'captain-v4-engine-reset' "$HOME_HTML"
          test -s crew-meeting-android/app/src/main/assets/v4_png_report.js
          node --check crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq "canvas.toDataURL('image/png')" crew-meeting-android/app/src/main/assets/v4_png_report.js
          grep -Fq 'new V4PngSaver()' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq 'SAVE_V4_PNG_CODE' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq 'name="v4_png_report.js";mime="text/javascript"' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq 'crew-db1-1-1247.json' "$HOME_HTML"
          grep -Fq 'crew-captain-engine-r46.html' "$HOME_HTML"
          grep -Fq 'crew-liaison-blind-r1.mjs' "$HOME_HTML"
          grep -Fq '선장엔진 R46 · 5조합' "$HOME_HTML"
          grep -Fq '통제실장엔진 R1 · 5조합' "$HOME_HTML"
          grep -Fq 'DB1_SHA256_INVALID_' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          test -s crew-meeting-android/app/src/main/assets/captain_engine_r46.html
          test -s crew-meeting-android/app/src/main/assets/liaison-blind-engine.mjs
          test -s crew-meeting-android/app/src/main/assets/db1_rounds_1_1247.json
          grep -Fq '누적자료는 이 자료실에서만 조회합니다.' "$HOME_HTML"
          grep -Fq "window.captainV4Route('v4')" "$HOME_HTML"
          grep -Fq 'id="freedomGoCumulativeDb"' "$HOME_HTML"
          grep -Fq 'id="cumulativeAfterDashboard"' "$HOME_HTML"
          grep -Fq 'id="cumDrawNumbers"' "$HOME_HTML"
          grep -Fq 'id="cumRefresh"' "$HOME_HTML"
          grep -Fq 'captainCumulativeOpen' "$HOME_HTML"
          grep -Fq 'crew-cumulative-after.css' "$HOME_HTML"
          grep -Fq 'crew-cumulative-after.js' "$HOME_HTML"
          test "$(grep -c 'class="cumRoom" data-room=' "$HOME_HTML")" -eq 7
          test "$(grep -o 'class="cumHit pending"' "$HOME_HTML" | wc -l)" -eq 35
          grep -Fq 'id="cumJumpMore"' "$HOME_HTML"
          grep -Fq 'id="homeCumulativeScoreBtn"' "$HOME_HTML"
          grep -Fq 'id="cumGoTotalScore"' "$HOME_HTML"
          grep -Fq 'id="cumulativeScoreDashboard"' "$HOME_HTML"
          grep -Fq 'id="scoreTotalCount"' "$HOME_HTML"
          grep -Fq 'id="scoreSuccessPercent"' "$HOME_HTML"
          grep -Fq 'id="scoreSuccessThreshold"' "$HOME_HTML"
          grep -Fq 'id="scoreSyncStatus"' "$HOME_HTML"
          test "$(grep -o 'class="scoreGrade"' "$HOME_HTML" | wc -l)" -eq 8
          test "$(grep -o 'class="scoreRoom" data-score-room=' "$HOME_HTML" | wc -l)" -eq 8
          grep -Fq '5/6+보너스' "$HOME_HTML"
          grep -Fq '총성공확률' "$HOME_HTML"
          grep -Fq 'window.captainCumulativeScoreOpen=function' "$HOME_HTML"
          grep -Fq "window.captainCumulativeScoreRender=renderScore" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq "독립 원본 미수신 · 미집계 (0점 아님)" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq "cumulativeScoreMode" crew-meeting-android/app/src/main/assets/cumulative_after_only.css
          grep -Fq 'id="cumRoomGrid"' "$HOME_HTML"
          grep -Fq 'data-room="v7"' "$HOME_HTML"
          grep -Fq 'data-room="v4-1"' "$HOME_HTML"
          grep -Fq 'data-room="v4-2"' "$HOME_HTML"
          grep -Fq "['v3','v7','freedom'].map" "$HOME_HTML"
          grep -Fq "grid-auto-rows:168px" crew-meeting-android/app/src/main/assets/cumulative_after_only.css
          grep -Fq "overflow-y:auto" crew-meeting-android/app/src/main/assets/cumulative_after_only.css
          grep -Fq "raw_predictions_included!==false" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq "roomIds=['v3-1','v3-2','v3-3','v3-4','v7','v4-1','v4-2']" crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          test -s crew-meeting-android/app/src/main/assets/cumulative_after_only.css
          test -s crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          test -s crew-meeting-android/app/src/main/assets/official_draws_verified_17.json
          node --check crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq 'CAPTAIN_NAVAL_THEME_R30' crew-meeting-android/app/src/main/assets/cumulative_after_only.css
          grep -Fq 'id="v8Hero"' "$HOME_HTML"
           ! grep -Fq 'data-app-card="v7"' "$HOME_HTML"
           ! grep -Fq 'id="originalController"' "$HOME_HTML"
           grep -Fq 'id="v8ServerQuick"' "$HOME_HTML"
           grep -Fq 'id="v8CheckV3Server"' "$HOME_HTML"
          grep -Fq 'data-app-card="v8"' "$HOME_HTML"
          grep -Fq '항행의자유 중앙통제실 V8' "$HOME_HTML"
          grep -Fq '통제실장' "$HOME_HTML"
          ! grep -Fq '연락관' "$HOME_HTML"
          ! grep -Fq '중앙연결관' "$HOME_HTML"
          grep -Fq 'crew-v8-home.css' "$HOME_HTML"
          test -s crew-meeting-android/app/src/main/assets/captain_v8.css
          test -s crew-meeting-android/app/src/main/assets/captain_v8_hero.svg
          test -s crew-meeting-android/app/src/main/assets/captain_v8_cinematic.webp
          echo "fadeda26f030d1c4e386cf6c1d0268b65ce01438dc7d7fae5329dcbfdd1574e6  crew-meeting-android/app/src/main/assets/captain_v8_cinematic.webp" | sha256sum --check -
          grep -Fq 'crew-v8-cinematic.webp' crew-meeting-android/app/src/main/assets/captain_v8.css
          grep -Fq 'captain_v8_cinematic.webp' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq 'id="v8ExitBtn"' "$HOME_HTML"
          grep -Fq 'id="homeDirectorRoomOpen"' "$HOME_HTML"
          grep -Fq 'id="homeDirectorRoom"' "$HOME_HTML"
          grep -Fq 'id="directorOriginalEdit"' "$HOME_HTML"
          grep -Fq 'v8AdvancedOperations' "$HOME_HTML"
          grep -Fq 'V8 통합 지휘본부' "$HOME_HTML"
          grep -Fq '⚓ 중앙통제실 V8' "$HOME_HTML"
          grep -Fq 'crew-v8-hero.svg' crew-meeting-android/app/src/main/assets/captain_v8.css
          grep -Fq 'captain_v8_hero.svg' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq 'android:label="항행의자유 중앙통제실 V8"' crew-meeting-android/app/src/main/AndroidManifest.xml
          grep -Fq 'captainSevenRoomScoreRead=async function' "$HOME_HTML"
          grep -Fq 'researchRate(grades,threshold)' crew-meeting-android/app/src/main/assets/cumulative_after_only.js
          grep -Fq 'id="crewUpdateOpen" type="button" aria-label="V8 업데이트 상태 확인"' "$HOME_HTML"
          grep -Fq '업데이트 확인' "$HOME_HTML"
          ! grep -Fq '1NtFkXk2HPqUOPsp2K-as29r9SHgKJmYc' "$HOME_HTML"
          python3 - <<'PY'
          import json
          x=json.load(open('crew-meeting-android/app/src/main/assets/official_draws_verified_17.json'))
          assert x['count']==17 and len(x['rows'])==17
          assert [r['round_no'] for r in x['rows']]==list(range(1,17))+[1247]
          for r in x['rows']:
              assert len(r['numbers'])==6 and len(set(r['numbers']))==6
              assert all(1<=n<=45 for n in r['numbers'])
              assert 1<=r['bonus']<=45 and r['bonus'] not in r['numbers']
          print('17 actual official draw records, 4 rooms x 5 result-after slots: PASS')
          PY
          grep -Fq 'id="freedomRunRound"' "$HOME_HTML"
          grep -Fq 'id="freedomFirstList"' "$HOME_HTML"
          grep -Fq 'id="freedomSecondList"' "$HOME_HTML"
          grep -Fq "window.captainV4Route('v4')" "$HOME_HTML"
          grep -Fq "window.captainV4Route('director')" "$HOME_HTML"
          grep -Fq 'main.roomMode > #freedomAnalysisPanel:not([hidden])' "$HOME_HTML"
          grep -Fq '선장엔진 R46 · 통제실장엔진 R1 검증 대기' "$HOME_HTML"
          ! grep -Fq 'openFreedomApprovalShortcut' "$HOME_HTML"
          grep -Fq 'data-v3-room-card="v3-4"' "$HOME_HTML"
          grep -Fq 'data-v3-report="v3-1"' "$HOME_HTML"
          grep -Fq 'data-material-stage="after"' "$HOME_HTML"
          grep -Fq 'V3의 과거 350회 누적 분석은 별도 보존' "$HOME_HTML"
          grep -Fq 'loadCaptainDashboard()' crew-meeting-android/app/src/main/java/kr/hanghae/crewmeeting/MainActivity.java
          grep -Fq "versionCode 807" crew-meeting-android/app/build.gradle
          test "$(grep -c 'data-before-room=' "$HOME_HTML")" -eq 7
          test "$(grep -c 'data-v3-room-card=' "$HOME_HTML")" -eq 4
          test "$(grep -c 'data-v3-report=' "$HOME_HTML")" -eq 4
          echo 'Embedded captain-only report-before and report-after modules: present'
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('crew-meeting-android/app/src/main/assets')
          html=(root/'captain_home_v114.html').read_text()
          for path in ['db1_rounds_1_1247.json','captain_engine_r46.html','liaison-blind-engine.mjs']:
              assert path in html, 'missing HTML asset reference: '+path
              assert (root/path).is_file(), 'missing APK asset: '+path
          for obsolete in ['crew-db1-1-1247.json','crew-captain-engine-r46.html','crew-liaison-blind-r1.mjs']:
              assert obsolete not in html, 'obsolete asset reference: '+obsolete
          print('V8 original-analysis assets verified')
          PY
      - name: Assemble separate app
        working-directory: crew-meeting-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Validate standalone APK and emit sha256
        run: |
          set -euo pipefail
          APK=crew-meeting-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/crew-apk-signer.log
          NEW_CERT=$(sed -n "s/^V2 Signer: certificate SHA-256 digest: //p" /tmp/crew-apk-signer.log | head -1)
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "e24e9573e5e98567ea2e5abddac427126c43d8f1e46b37e4099dabc911cf70be"
          echo "Recovery app signer pinned: $NEW_CERT"
          "$AAPT" dump badging "$APK" | head -5
          "$AAPT" dump badging "$APK" | grep -q "package: name='kr.hanghae.crewmeeting.compact' versionCode='807'"
          ! "$AAPT" dump badging "$APK" | grep -q "package: name='com.baekhak.dosa.v4'"
          mkdir -p crew-meeting-android/releases
          cp "$APK" crew-meeting-android/releases/HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk
          (cd crew-meeting-android/releases && sha256sum HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk > HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: HANGHAE-CREW-MEETING-V8-8.0.7-DIRECTOR-ANALYSIS-DISTRIBUTION-APK
          path: |
            crew-meeting-android/releases/HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk
            crew-meeting-android/releases/HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Verify isolated APK artifact packaging
        run: |
          set -euo pipefail
          test -s crew-meeting-android/releases/HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk
          test -s crew-meeting-android/releases/HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk.sha256
          (cd crew-meeting-android/releases && sha256sum --check HANGHAE_CREW_MEETING_V8_8.0.7_DIRECTOR_ANALYSIS_DISTRIBUTION.apk.sha256)
          echo "TEST artifact verified. Do NOT replace the stable fixed Google Drive APK without device verification."

