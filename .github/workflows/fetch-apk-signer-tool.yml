name: Fetch APK signer tool
on:
  push:
    paths:
      - '.github/workflows/fetch-apk-signer-tool.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download tool
        run: |
          curl -fL 'https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar' -o uber-apk-signer-1.3.0.jar
          sha256sum uber-apk-signer-1.3.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-tool
          path: uber-apk-signer-1.3.0.jar
