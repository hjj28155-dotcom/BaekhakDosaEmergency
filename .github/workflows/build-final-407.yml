name: Build Freedom V3 Final 407 No Floating Icon
on:
  push:
    paths:
      - '.github/workflows/build-final-407.yml'
      - '.github/scripts/patch_remove_main_overlay_407.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download V404 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-afe0-8206-ad0c-376df9eb8ef7/raw?se=2026-10-01T01%3A34%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=21fb5e4c-3f0c-5cf0-9b57-1bea427006f1&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T01%3A16%3A08Z&ske=2026-10-02T01%3A16%3A08Z&sks=b&skv=2026-02-06&sig=Fp4AqyfwApfZ9J03bagUvvNSxnZcQ/6xkZwFU6AesIk%3D' -o source.zip
          rm -rf build407
          mkdir build407
          unzip -q source.zip -d build407
          test -f build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/index.html
      - name: Download final welcome scroll
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-6a68-8206-9249-aec8575884fe/raw?se=2026-10-01T01%3A34%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=24949fab-4fe8-53e9-ab3d-6bc64d5bd6f9&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T01%3A23%3A56Z&ske=2026-10-02T01%3A23%3A56Z&sks=b&skv=2026-02-06&sig=0SxoJ7eyv5hoAHfmoq%2BwYh8qqDJ6PKq4BngEcJWW1Oo%3D' -o build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/welcome_scroll_final.png
          test -s build407/FREEDOM_V402_BUILD_THIS/app/src/freedom/assets/welcome_scroll_final.png
      - name: Apply V405 ordered flow
        run: |
          sed 's|build405/FREEDOM_V402_BUILD_THIS|build407/FREEDOM_V402_BUILD_THIS|g' .github/scripts/patch_final_405.py > /tmp/p405.py
          python3 /tmp/p405.py
      - name: Apply V406 scroll plus approval
        run: |
          sed 's|build405/FREEDOM_V402_BUILD_THIS|build407/FREEDOM_V402_BUILD_THIS|g' .github/scripts/patch_scroll_approval_406.py > /tmp/p406.py
          python3 /tmp/p406.py
      - name: Remove floating icon from main app
        run: python3 .github/scripts/patch_remove_main_overlay_407.py
      - name: Build APK
        working-directory: build407/FREEDOM_V402_BUILD_THIS
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" ../FREEDOM_V3_FINAL_407-debug.apk
      - name: Publish final APK
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f FREEDOM_V3_FINAL_40*-debug.apk
          cp build407/FREEDOM_V3_FINAL_407-debug.apk ./FREEDOM_V3_FINAL_407-debug.apk
          git add -A
          git commit -m 'Publish Freedom V4.0.7 without floating icon'
          git push
