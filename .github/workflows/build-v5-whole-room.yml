name: Build V5 Whole Room APK
on:
  push:
    paths:
      - 'v5-whole-room/**'
      - '.github/workflows/build-v5-whole-room.yml'
permissions:
  contents: write
concurrency:
  group: v5-whole-room-apk-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Preserve signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: v5-whole-room-companion-stable-debug-key-20261016
      - name: Ensure signing key
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=V5 Whole Room,O=Hanghae Freedom,C=KR" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Assemble APK
        working-directory: v5-whole-room
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find v5-whole-room/app/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -4
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" V5_WHOLE_ROOM_20261016.apk
          sha256sum V5_WHOLE_ROOM_20261016.apk > V5_WHOLE_ROOM_20261016.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: V5-WHOLE-ROOM-APK
          path: |
            V5_WHOLE_ROOM_20261016.apk
            V5_WHOLE_ROOM_20261016.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK as direct-download file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f V5_WHOLE_ROOM_20261016.apk V5_WHOLE_ROOM_20261016.apk.sha256
          git commit -m 'Publish V5 whole-room companion APK' || exit 0
          git push origin HEAD:main
