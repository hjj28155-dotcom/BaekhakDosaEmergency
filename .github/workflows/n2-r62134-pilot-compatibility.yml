name: N2 R6.21.34 pilot APK compatibility audit

on:
  workflow_dispatch:
  push:
    branches:
      - n2-r62134-pilot-20261110
    paths:
      - '.github/workflows/n2-r62134-pilot-compatibility.yml'
      - 'r6-n2-standalone/pilot/verify-r62134-compatibility.sh'
      - 'r6-n2-standalone/pilot/N2_R62134_OWNER_PILOT.apk'

permissions:
  contents: read

jobs:
  verify-n2-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pilot branch without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit old and pilot APK hashes, signatures and versions (read-only)
        id: apk_audit
        shell: bash
        run: |
          set -o pipefail
          bash r6-n2-standalone/pilot/verify-r62134-compatibility.sh 2>&1 | tee n2-r62134-compatibility-audit.log
      - name: Preserve audit log for review even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n2-r62134-compatibility-audit-${{ github.run_id }}
          path: n2-r62134-compatibility-audit.log
          if-no-files-found: warn
          retention-days: 30
