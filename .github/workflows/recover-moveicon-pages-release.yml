name: Recover stalled MoveIcon Pages publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-moveicon-pages-release.yml]
permissions:
  contents: read
  pages: write
  actions: write
  deployments: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify committed compact distribution page
        uses: actions/checkout@v4
      - name: Check intended page without changing existing APK routes
        run: |
          set -euo pipefail
          grep -q '<details class="note">' moveicon.html
          grep -q 'id="moveicon-apk"' moveicon.html
          grep -q 'id="freedom-apk-route"' moveicon.html
          grep -q 'href="./"' moveicon.html
          echo "Source layout PASS; original moveicon and freedom APK routes preserved"
      - name: Diagnose and unlock stalled GitHub managed Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo '=== Current Pages queue ==='
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/39798823273 --jq '{id,status,conclusion,head_sha}' || true
          echo '=== Environment deployments ==='
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" --jq '.[] | {id,sha,environment,created_at}' || true
          echo '=== Cancel obsolete queued Pages run ==='
          gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/39798823273/cancel || true
          sleep 8
          echo '=== Force cancel if still queued ==='
          STATE=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/39798823273 --jq '.status' || echo unknown)
          if [ "$STATE" != "completed" ]; then
             gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/39798823273/force-cancel || true
          fi
          echo '=== Re-trigger standard Pages publication from main ==='
          gh api -X POST repos/${GITHUB_REPOSITORY}/pages/builds || true
          echo '=== Subsequent Pages queue ==='
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=8" --jq '[.workflow_runs[]|{name,status,conclusion,head_sha}]' || true
      - name: Check publicly delivered HTML
        run: |
          set -u
          URL='https://hjj28155-dotcom.github.io/BaekhakDosaEmergency/moveicon.html'
          for N in 1 2 3 4 5 6; do
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$URL?check=${GITHUB_SHA}-$N" -o /tmp/public-page.html || true
            if grep -q '이동아이콘 기능 안내 펼쳐보기' /tmp/public-page.html; then
              echo 'PASS: Public site serves new compact page'
              grep -n 'freedom-apk-route\|moveicon-apk' /tmp/public-page.html | head -3
              exit 0
            fi
            echo "Public page has not updated yet - attempt $N"
            sleep 12
          done
          echo 'NOT YET DEPLOYED: public page still serves old content'
          exit 1
