name: V1061 separate package fit-screen
on:
  push:
    branches: [v1059-build-temp]
    paths: ['.github/workflows/v1061-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare V1061 separate-package source
        run: |
          set -euxo pipefail
          rm -rf /tmp/v1061
          mkdir -p /tmp/v1061
          unzip -q source.zip -d /tmp/v1061
          cd /tmp/v1061/FREEDOM_V402_BUILD_THIS

          curl -fL --retry 3 'https://drive.usercontent.google.com/download?id=11NFCZXyd4hsi66BDkrR8ggUEKZ1Za1GM&export=download&confirm=t' -o /tmp/v1060_patch.zip
          unzip -oq /tmp/v1060_patch.zip -d .

          # Existing app must remain untouched: install as a completely separate package.
          sed -i "s/applicationId 'com.navigator.freedom.overlayicon'/applicationId 'com.navigator.freedom.overlayicon.v1061test'/" app/build.gradle
          sed -i 's/versionCode 1060/versionCode 1061/' app/build.gradle
          sed -i 's/versionName "1.0.60"/versionName "1.0.61-test"/' app/build.gradle
          sed -i 's/OVERLAY_ICON_V1060_VIDEO_PIP_MANUAL_PRIVATE-debug.apk/OVERLAY_ICON_V1061_SEPARATE_PIP_FIT_ANCHOR-debug.apk/g' app/build.gradle

          # Full screen: preserve aspect ratio and show black margins instead of cropping.
          sed -i 's/full?MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT_WITH_CROPPING:MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT/MediaPlayer.VIDEO_SCALING_MODE_SCALE_TO_FIT/' app/src/main/java/com/baekhak/centralcontrol/LocalMediaPickerActivity.java

          # Make the test edition easy to distinguish in installer/app list.
          sed -i 's/android:label="@string\/app_name"/android:label="이동아이콘 V1061"/' app/src/main/AndroidManifest.xml

          # Keep the established anchor icon.
          cp app/src/main/res/drawable/v3_ship_icon.png app/src/main/res/drawable/overlay_anchor_icon.png
          chmod +x gradlew

          grep -n "applicationId\|versionCode\|versionName\|outputFileName" app/build.gradle
          grep -n "VIDEO_SCALING_MODE" app/src/main/java/com/baekhak/centralcontrol/LocalMediaPickerActivity.java
          grep -n "LocalMediaPickerActivity\|android:label" app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: /tmp/v1061/FREEDOM_V402_BUILD_THIS
        run: |
          set -euxo pipefail
          gradle assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" /tmp/OVERLAY_ICON_V1061_SEPARATE_PIP_FIT_ANCHOR-debug.apk
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=/tmp/OVERLAY_ICON_V1061_SEPARATE_PIP_FIT_ANCHOR-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -12 | tee /tmp/V1061_BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/V1061_SIGNATURE.txt
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee /tmp/V1061_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OVERLAY_ICON_V1061_SEPARATE_PIP_FIT_ANCHOR
          path: |
            /tmp/OVERLAY_ICON_V1061_SEPARATE_PIP_FIT_ANCHOR-debug.apk
            /tmp/V1061_BADGING.txt
            /tmp/V1061_SIGNATURE.txt
            /tmp/V1061_SHA256.txt
