name: Make MAX Volume Guide Audio

on:
  push:
    paths:
      - '.github/workflows/make-max-volume-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  amplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Amplify source MP3
        run: |
          set -euo pipefail
          ffmpeg -y -i kimkwangseok_ileona.mp3             -af "volume=9dB,alimiter=limit=0.97:attack=5:release=50"             -codec:a libmp3lame -b:a 320k             kimkwangseok_ileona_boosted.mp3
          test -s kimkwangseok_ileona_boosted.mp3
          mv kimkwangseok_ileona_boosted.mp3 kimkwangseok_ileona.mp3

      - name: Publish amplified source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kimkwangseok_ileona.mp3
          git commit -m 'Amplify guide audio source to MAX volume' || true
          git pull --rebase origin main
          git push
