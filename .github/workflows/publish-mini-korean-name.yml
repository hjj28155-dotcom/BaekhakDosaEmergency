name: Publish Korean Mini Overlay APK
on:
  push:
    paths:
      - '.github/workflows/publish-mini-korean-name.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy APK with Korean filename
        run: |
          set -euo pipefail
          test -s HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk
          cp HANGHAE_MINI_MP3_FM_AM_YOUTUBE-debug.apk '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '항행의자유_이동아이콘_MP3_FM_AM_유튜브.apk'
          git commit -m 'Publish Korean named mini overlay APK'
          git push
