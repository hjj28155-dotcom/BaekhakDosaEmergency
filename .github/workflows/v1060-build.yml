name: V1060 build PIP video
on:
  push:
    branches: [v1059-build-temp]
    paths: ['.github/workflows/v1060-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare V1060 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/v1060
          mkdir -p /tmp/v1060
          unzip -q source.zip -d /tmp/v1060
          cd /tmp/v1060/FREEDOM_V402_BUILD_THIS
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-1d60-8206-b873-4d1afc029391/raw?se=2026-10-06T00%3A56%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=301c2f2f-a478-58ee-909d-b7a4286f3de2&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T23%3A13%3A00Z&ske=2026-10-06T23%3A13%3A00Z&sks=b&skv=2026-02-06&sig=6bL146yq23JcsNm7A2exWQknBzPMtNrJFfHACwcfEdg%3D' -o /tmp/v1060_patch.zip
          echo 'da67e1f7cbfbde42839a23bcd279056d7eee5a826365c8ae34674ba27a75ef4d  /tmp/v1060_patch.zip' | sha256sum -c -
          unzip -oq /tmp/v1060_patch.zip -d .
          cp app/src/main/res/drawable/v3_ship_icon.png app/src/main/res/drawable/overlay_anchor_icon.png
          chmod +x gradlew
      - name: Build APK
        working-directory: /tmp/v1060/FREEDOM_V402_BUILD_THIS
        run: |
          set -euxo pipefail
          gradle assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" /tmp/OVERLAY_ICON_V1060_VIDEO_PIP_MANUAL_PRIVATE-debug.apk
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=/tmp/OVERLAY_ICON_V1060_VIDEO_PIP_MANUAL_PRIVATE-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | head -8
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK" | tee /tmp/V1060_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OVERLAY_ICON_V1060_VIDEO_PIP_MANUAL_PRIVATE
          path: |
            /tmp/OVERLAY_ICON_V1060_VIDEO_PIP_MANUAL_PRIVATE-debug.apk
            /tmp/V1060_SHA256.txt
