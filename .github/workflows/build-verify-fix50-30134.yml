name: Build verify FIX50 30134
on:
  push:
    paths:
      - '.github/workflows/build-verify-fix50-30134.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download source
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-3b98-8209-bdc6-1f4cfef177f7/raw?se=2026-09-28T10%3A23%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=ff8bbcba-0942-5dba-bfb5-03a9e29ef966&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T00%3A28%3A26Z&ske=2026-09-29T00%3A28%3A26Z&sks=b&skv=2026-02-06&sig=8HyMOguYh6k0qlZiAnLurPoLPFLIysmZsJ2mf33%2BwRw%3D' -o source.zip
          rm -rf buildsrc && mkdir buildsrc
          unzip -q source.zip -d buildsrc
          test -d buildsrc/FREEDOM_V3_FIX50_BUILD_THIS
      - name: Build
        run: |
          set -euo pipefail
          cd buildsrc/FREEDOM_V3_FIX50_BUILD_THIS
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/FreedomV3_V1_DirectUpdate_FIX50-debug.apk"
      - name: Verify package/version/signature
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging FreedomV3_V1_DirectUpdate_FIX50-debug.apk | tee fix50_badging.txt
          grep -q "package: name='com.baekhak.dosalivedist'" fix50_badging.txt
          grep -q "versionCode='30134'" fix50_badging.txt
          "$APKSIGNER" verify --print-certs FreedomV3_V1_DirectUpdate_FIX50-debug.apk | tee fix50_signature.txt
          "$APKSIGNER" verify --print-certs FreedomV3_V1_DirectUpdate_FIX44-debug.apk | tee fix44_signature_check.txt
          NEW=$(grep 'certificate SHA-256 digest:' fix50_signature.txt | head -1 | awk '{print $NF}')
          OLD=$(grep 'certificate SHA-256 digest:' fix44_signature_check.txt | head -1 | awk '{print $NF}')
          echo "FIX50=$NEW"
          echo "FIX44=$OLD"
          test "$NEW" = "$OLD"
      - name: Publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FreedomV3_V1_DirectUpdate_FIX50-debug.apk fix50_badging.txt fix50_signature.txt
          git commit -m 'Publish verified Freedom V3 FIX50 30134'
          git push
