name: Build V1062 MP3 Update TV Fix
on:
  push:
    paths:
      - '.github/workflows/build-v1062-mp3-update-tv.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v1062-mp3-update-tv-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download patched V1062-lineage source
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 20 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-814c-8211-acec-c7dc178a22db/raw?se=2026-10-07T11%3A19%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=371b571f-189e-5418-9ee0-316161888b8f&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A37%3A31Z&ske=2026-10-08T00%3A37%3A31Z&sks=b&skv=2026-02-06&sig=sRdeNLzXPflKAKFFvnNM/dByfyIgNzlBSY8%2BLS8ahiU%3D' -o /tmp/v1062fix.zip
          test -s /tmp/v1062fix.zip
          unzip -q /tmp/v1062fix.zip -d /tmp/v1062fix
          test -f /tmp/v1062fix/OVERLAY_ICON_V1057/app/build.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Persist stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hanghae-mini-stable-debug-keystore-v1

      - name: Prepare stable signing key
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Hanghae Freedom Move Icon,O=Hanghae Freedom,C=KR"               -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build APK
        working-directory: /tmp/v1062fix/OVERLAY_ICON_V1057
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' | head -1)"

      - name: Verify install compatibility with v1.0.76
        run: |
          set -euo pipefail
          NEW_APK=$(find /tmp/v1062fix/OVERLAY_ICON_V1057/app/build/outputs/apk -type f -name '*.apk' | head -1)
          curl -fL --retry 2 --connect-timeout 20 'https://raw.githubusercontent.com/hjj28155-dotcom/BaekhakDosaEmergency/main/OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE_v1.0.76.apk' -o /tmp/v1076.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          OLD_CERT=$("$APKSIGNER" verify --print-certs /tmp/v1076.apk 2>&1 | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $2; exit}')
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$NEW_APK" 2>&1 | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ {print $2; exit}')
          if [ -z "$OLD_CERT" ]; then OLD_CERT=$(keytool -printcert -jarfile /tmp/v1076.apk 2>/dev/null | awk -F': ' '/SHA256:/ {print $2; exit}'); fi
          if [ -z "$NEW_CERT" ]; then NEW_CERT=$(keytool -printcert -jarfile "$NEW_APK" 2>/dev/null | awk -F': ' '/SHA256:/ {print $2; exit}'); fi
          echo "v1.0.76 cert: $OLD_CERT"
          echo "v1.0.79 cert: $NEW_CERT"
          test -n "$OLD_CERT"
          test "$OLD_CERT" = "$NEW_CERT"
          echo "Signing certificate matches v1.0.76"

      - name: Publish APK
        run: |
          set -euo pipefail
          APK=$(find /tmp/v1062fix/OVERLAY_ICON_V1057/app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" /tmp/OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE.apk

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE.apk OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE.apk
          cp /tmp/OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE.apk OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE_v1.0.79.apk

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE.apk OVERLAY_ICON_V1062_MP3_MP4_APPFOLDERS_TV_LIVE_STABLE_v1.0.79.apk
          git commit -m 'Publish V1062 stable v1.0.79 high-code install-compatible APK' || exit 0
          git push origin HEAD:main

