name: Mix onboarding BGM final
on:
  push:
    paths:
      - '.github/workflows/mix-onboarding-bgm-final.yml'
permissions:
  contents: write
jobs:
  mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Download selected BGM
        run: |
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7134-8206-9f7d-66859ed1a2e8/raw?se=2026-09-27T10%3A26%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=5fa430e5-a14e-5972-b48c-acc54e265091&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T08%3A11%3A27Z&ske=2026-09-28T08%3A11%3A27Z&sks=b&skv=2026-02-06&sig=cjT6uzUM1VpfBcdwpEjg0GVsvGg2AqXn3lOcfaUsYYM%3D' -o bgm.mp3
          test -s bgm.mp3
      - name: Build final onboarding video
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="freedom_onboarding_latest.mp4"
          FONT="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          test -f "$VIDEO"
          test -f "$FONT"

          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")
          HAS_AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 "$VIDEO" | head -n1 || true)

          cat > endcard.txt <<'EOF'
설치 및 업데이트는 지금 마지막 화면 다음에
공지사항에 있는 설치 동영상을 보시면서 진행하세요.
EOF

          if [ -n "$HAS_AUDIO" ]; then
            ffmpeg -y -i "$VIDEO"               -vf "fps=30,format=yuv420p"               -af "aresample=44100,aformat=sample_fmts=fltp:channel_layouts=stereo"               -c:v libx264 -preset medium -crf 20 -c:a aac -b:a 192k normalized.mp4
          else
            DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
            ffmpeg -y -i "$VIDEO" -f lavfi -t "$DUR" -i anullsrc=r=44100:cl=stereo               -vf "fps=30,format=yuv420p"               -map 0:v -map 1:a               -c:v libx264 -preset medium -crf 20 -c:a aac -b:a 192k -shortest normalized.mp4
          fi

          ffmpeg -y             -f lavfi -i "color=c=0x061c2c:s=${W}x${H}:r=30:d=5"             -f lavfi -i "anullsrc=r=44100:cl=stereo"             -vf "drawtext=fontfile=${FONT}:textfile=endcard.txt:fontcolor=white:fontsize=h/22:line_spacing=h/80:x=(w-text_w)/2:y=(h-text_h)/2:box=1:boxcolor=0x0b3148@0.82:boxborderw=h/28"             -t 5 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k card.mp4

          ffmpeg -y -i normalized.mp4 -i card.mp4             -filter_complex "[0:v][0:a][1:v][1:a]concat=n=2:v=1:a=1[v][a]"             -map "[v]" -map "[a]"             -c:v libx264 -preset medium -crf 20 -c:a aac -b:a 192k combined.mp4

          TOTAL=$(ffprobe -v error -show_entries format=duration -of csv=p=0 combined.mp4)
          FADE_START=$(python3 - <<PY
t=float("${TOTAL}")
print(max(0,t-2))
PY
)

          ffmpeg -y -i combined.mp4 -stream_loop -1 -i bgm.mp3             -filter_complex "[0:a]volume=1.0[main];[1:a]volume=0.09,afade=t=in:st=0:d=1,atrim=0:${TOTAL},afade=t=out:st=${FADE_START}:d=2[bgm];[main][bgm]amix=inputs=2:duration=first:dropout_transition=2[aout]"             -map 0:v -map "[aout]"             -c:v copy -c:a aac -b:a 192k -shortest freedom_onboarding_latest_FINAL.mp4

          mv freedom_onboarding_latest_FINAL.mp4 freedom_onboarding_latest.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 freedom_onboarding_latest.mp4
      - name: Commit final video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom_onboarding_latest.mp4
          git commit -m "Finalize onboarding video with BGM and end card"
          git push
