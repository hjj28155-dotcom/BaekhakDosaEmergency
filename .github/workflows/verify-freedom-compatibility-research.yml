name: Verify Freedom V3 upgrade signature compatibility (read only)
on:
  push:
    branches: [research-emergency-db1-1247-20261022]
    paths: ['.github/workflows/verify-freedom-compatibility-research.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Freedom_V3_DB1_1247_IsolatedTrial
          run-id: 39715638756
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: trial
      - name: Compare previous APK and trial signing certificates
        shell: bash
        run: |
          set -euo pipefail
          OLD=FREEDOM_V3_FINAL_407-debug.apk
          NEW=trial/Freedom_V3_DB1_1247_ISOLATED_TRIAL.apk
          test -s "$OLD"; test -s "$NEW"
          APKTOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKTOOL" verify --print-certs "$OLD" > /tmp/old_all.txt 2>&1 || true
          "$APKTOOL" verify --print-certs "$NEW" > /tmp/new_all.txt 2>&1 || true
          grep -Ei 'certificate SHA-256 digest|certificate DN' /tmp/old_all.txt > /tmp/old_certs.txt || true
          grep -Ei 'certificate SHA-256 digest|certificate DN' /tmp/new_all.txt > /tmp/new_certs.txt || true
          echo 'Old verify diagnostics:'; tail -10 /tmp/old_all.txt
          echo 'Trial verify diagnostics:'; tail -10 /tmp/new_all.txt
          echo 'BASELINE APK:'; cat /tmp/old_certs.txt
          echo 'TRIAL APK:'; cat /tmp/new_certs.txt
          echo 'TRIAL APPLICATION ID:'
          grep -q "applicationId 'com.navigator.freedom.v3final'" build407/FREEDOM_V402_BUILD_THIS/app/build.gradle && echo 'research build injects .db1trial after checkout'
          OLD_SHA="$(grep -im1 'SHA-256 digest' /tmp/old_certs.txt | sed 's/.*digest: //' || true)"
          NEW_SHA="$(grep -im1 'SHA-256 digest' /tmp/new_certs.txt | sed 's/.*digest: //' || true)"
          test -n "$OLD_SHA"; test -n "$NEW_SHA"
          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo 'SIGNATURE MATCH; applicationId intentionally different for isolated build'
          else
            echo 'SIGNATURE MISMATCH; DO NOT DIRECT UPDATE EXISTING APP'
          fi
