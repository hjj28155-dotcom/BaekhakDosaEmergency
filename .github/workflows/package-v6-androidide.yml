name: Package V6 AndroidIDE Project ZIP
on:
  push:
    paths:
      - 'v6/**'
      - '.github/workflows/package-v6-androidide.yml'
permissions:
  contents: write
concurrency:
  group: v6-androidide-project-publish
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Generate Gradle wrapper for AndroidIDE
        working-directory: v6
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin --no-daemon
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradlew
          chmod +x gradlew
      - name: Verify exact extracted-project build
        working-directory: v6
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify updated V6 navigation and version
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          BADGE=$("$AAPT" dump badging v6/app/build/outputs/apk/debug/app-debug.apk | head -1)
          echo "$BADGE"
          grep -Fq "versionCode='600005'" <<< "$BADGE"
          grep -Fq "id=\"quicknav\"" v6/app/src/main/assets/v6_fallback.html
          grep -Fq 'V6.checkUpdate()' v6/app/src/main/assets/v6_fallback.html
          grep -Fq 'canGoBack()' v6/app/src/main/java/kr/hanghae/v6/centralcontrol/MainActivity.java
          grep -Fq 'saveRoomName:' v6/app/src/main/assets/v6_fallback.html
          grep -Fq 'saveRoomLink:' v6/app/src/main/assets/v6_fallback.html
          grep -Fq '방제 저장' v6/app/src/main/assets/v6_fallback.html
          grep -Fq 'checkDevice(){' v6/app/src/main/assets/v6_fallback.html
          grep -Fq '기기 토큰 저장 실패' v6/app/src/main/assets/v6_fallback.html
          grep -Fq '1246회차 백학도사' v6/app/src/main/assets/v6_fallback.html
      - name: Package complete source without caches
        run: |
          set -euo pipefail
          mkdir -p V6_AndroidIDE_Project
          rsync -a --exclude='.gradle/' --exclude='build/' --exclude='.idea/' --exclude='*.apk' v6/ V6_AndroidIDE_Project/
          test -s V6_AndroidIDE_Project/settings.gradle
          test -s V6_AndroidIDE_Project/gradlew
          test -s V6_AndroidIDE_Project/gradle/wrapper/gradle-wrapper.jar
          test -s V6_AndroidIDE_Project/app/src/main/AndroidManifest.xml
          test -s V6_AndroidIDE_Project/app/src/main/java/kr/hanghae/v6/centralcontrol/MainActivity.java
          test -s V6_AndroidIDE_Project/app/src/main/assets/v6_fallback.html
          test -s V6_AndroidIDE_Project/ANDROIDIDE_빌드와_V6_업데이트_안내.md
          zip -q -r V6_AndroidIDE_Project_V6_0_4_20261017.zip V6_AndroidIDE_Project
          test -s V6_AndroidIDE_Project_V6_0_4_20261017.zip
          unzip -t V6_AndroidIDE_Project_V6_0_4_20261017.zip | tail -2
          sha256sum V6_AndroidIDE_Project_V6_0_4_20261017.zip > V6_AndroidIDE_Project_V6_0_4_20261017.zip.sha256
          unzip -l V6_AndroidIDE_Project_V6_0_4_20261017.zip | grep -E 'gradlew|gradle-wrapper.jar|MainActivity.java|v6_fallback.html'
      - name: Explain which folder to open
        run: |
          cat > OPEN_THIS_FOLDER.txt <<'TXT'
          항행의자유 V6 AndroidIDE 프로젝트
          1. ZIP 압축을 풉니다.
          2. V6_AndroidIDE_Project 폴더를 선택합니다.
          3. 그 폴더 안의 settings.gradle과 app 폴더를 확인합니다.
          4. AndroidIDE에서 V6_AndroidIDE_Project 폴더를 프로젝트로 엽니다.
          5. Build APK를 실행합니다.
          ZIP 내부의 HTML 파일을 직접 열면 앱 화면이 아닌 소스 코드가 보일 수 있습니다.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: V6-AndroidIDE-Project-With-Root-Folder
          path: |
            V6_AndroidIDE_Project/
            OPEN_THIS_FOLDER.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify artifact has the top-level project folder
        uses: actions/download-artifact@v4
        with:
          name: V6-AndroidIDE-Project-With-Root-Folder
          path: _verify_artifact_root
      - name: Assert actual downloaded artifact hierarchy
        run: |
          set -euo pipefail
          test -s _verify_artifact_root/OPEN_THIS_FOLDER.txt
          test -s _verify_artifact_root/V6_AndroidIDE_Project/settings.gradle
          test -s _verify_artifact_root/V6_AndroidIDE_Project/gradlew
          test -s _verify_artifact_root/V6_AndroidIDE_Project/gradle/wrapper/gradle-wrapper.jar
          test -s _verify_artifact_root/V6_AndroidIDE_Project/app/src/main/AndroidManifest.xml
          test -s _verify_artifact_root/V6_AndroidIDE_Project/app/src/main/assets/v6_fallback.html
          test ! -e _verify_artifact_root/settings.gradle
          echo 'PASS: project root directory intact inside downloaded artifact.'
      - name: Publish reviewed ZIP
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f V6_AndroidIDE_Project_V6_0_4_20261017.zip V6_AndroidIDE_Project_V6_0_4_20261017.zip.sha256
          git commit -m 'Publish V6 AndroidIDE project ZIP with Gradle wrapper' || exit 0
          git push origin HEAD:main
