name: Build MoveIcon V1.1.8 Multi Select Persistent
on:
  push:
    branches:
      - moveicon-v118-multiselect-persistent
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            MoveIcon_V1.1.8_MULTI_PERSIST_SOURCE.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | "$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)" --licenses >/dev/null || true
          "$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract repaired app
        run: |
          mkdir -p build_workspace
          unzip -q MoveIcon_V1.1.8_MULTI_PERSIST_SOURCE.zip -d build_workspace
      - name: Build standalone APK
        working-directory: build_workspace
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveIcon-V118-MultiPersist-APK
          path: build_workspace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish isolated trial APK
        run: |
          cp build_workspace/app/build/outputs/apk/debug/app-debug.apk MoveIcon_V1.1.8_MULTI_PERSIST_debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f MoveIcon_V1.1.8_MULTI_PERSIST_debug.apk
          git commit -m "Publish isolated V1.1.8 multi-select persistent APK [skip ci]"
          git push origin HEAD:moveicon-v118-multiselect-persistent
