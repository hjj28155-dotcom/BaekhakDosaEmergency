name: Diagnose v1.0.76 Signing Path
on:
  push:
    paths:
      - '.github/workflows/diagnose-v1076-signing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v1.0.76 source
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-09b4-8206-b2b8-511ffaf5fe3a/raw?se=2026-10-07T11%3A40%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=27a88318-3dc5-58ee-8fc5-4ce38c929942&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T01%3A04%3A12Z&ske=2026-10-08T01%3A04%3A12Z&sks=b&skv=2026-02-06&sig=WH6hQ/sCFKW%2B3we6BxdJxxdIMt74cw9Dbdt4nYzlaB4%3D' -o /tmp/v1076src.zip
          unzip -q /tmp/v1076src.zip -d /tmp/v1076src
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore stable key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hanghae-mini-stable-debug-keystore-v1
      - name: Show signing configuration
        working-directory: /tmp/v1076src/OVERLAY_ICON_V1057
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la ~/.android || true
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E 'Owner:|SHA256:'
          gradle signingReport --no-daemon
      - name: Build fresh and print APK cert
        working-directory: /tmp/v1076src/OVERLAY_ICON_V1057
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --no-build-cache
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
