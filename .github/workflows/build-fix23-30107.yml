name: Build and publish FIX23 30107
on:
  push:
    paths:
      - '.github/workflows/build-fix23-30107.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download FIX22 source package
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-0c54-8206-b2ab-cb98595499af/raw?se=2026-09-27T10%3A45%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=c0aa3818-969c-53c0-97f6-01dfbc4e6575&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T01%3A21%3A11Z&ske=2026-09-28T01%3A21%3A11Z&sks=b&skv=2026-02-06&sig=yk/nw6qxY95XcDYrHcgHWHb0XinN3g9b3ejapHDhi9Q%3D' -o source.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q source.zip -d buildsrc
          test -d buildsrc/FREEDOM_V3_FIX22_BUILD_THIS
      - name: Patch version to 30107
        shell: bash
        run: |
          set -euo pipefail
          ROOT='buildsrc/FREEDOM_V3_FIX22_BUILD_THIS'
          GRADLE="$ROOT/app/build.gradle"
          test -f "$GRADLE"
          sed -E -i '0,/versionCode[[:space:]]+[0-9]+/s//versionCode 30107/' "$GRADLE"
          sed -E -i "0,/versionName[[:space:]]+'[^']+'/s//versionName 'V3.1.07-FIX23'/" "$GRADLE"
          grep -nE 'versionCode|versionName' "$GRADLE"
      - name: Build FIX23
        run: |
          set -euo pipefail
          cd buildsrc/FREEDOM_V3_FIX22_BUILD_THIS
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/FreedomV3_V1_DirectUpdate_FIX23-debug.apk"
      - name: Verify FIX23
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging FreedomV3_V1_DirectUpdate_FIX23-debug.apk | tee fix23_badging.txt
          grep -q "package: name='com.baekhak.dosalivedist'" fix23_badging.txt
          grep -q "versionCode='30107'" fix23_badging.txt
          "$APKSIGNER" verify --print-certs FreedomV3_V1_DirectUpdate_FIX23-debug.apk | tee fix23_signature.txt
          "$APKSIGNER" verify --print-certs FreedomV3_V1_DirectUpdate_FIX22-debug.apk | tee fix22_signature_check.txt
          NEW=$(grep 'certificate SHA-256 digest:' fix23_signature.txt | head -1 | awk '{print $NF}')
          OLD=$(grep 'certificate SHA-256 digest:' fix22_signature_check.txt | head -1 | awk '{print $NF}')
          test "$NEW" = "$OLD"
      - name: Publish FIX23
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FreedomV3_V1_DirectUpdate_FIX23-debug.apk fix23_badging.txt fix23_signature.txt
          git commit -m 'Publish verified Freedom V3 FIX23 30107'
          git push
