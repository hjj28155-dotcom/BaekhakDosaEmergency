name: Fix onboarding end card portrait
on:
  push:
    paths:
      - '.github/workflows/fix-onboarding-endcard.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Replace last 5 seconds with portrait-safe card
        shell: bash
        run: |
          set -euo pipefail
          V='freedom_onboarding_latest.mp4'
          FONT='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          test -f "$V"
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          CUT=$(python3 -c "d=float('$D'); print(max(0,d-5.0))")
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$V")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$V")
          ffmpeg -y -i "$V" -filter_complex "[0:v]trim=start=0:end=${CUT},setpts=PTS-STARTPTS[main];color=c=0x061c2c:s=${W}x${H}:r=30:d=5,drawtext=fontfile=${FONT}:text='설치 및 실행설명서':fontcolor=0xffe58a:fontsize=h/13:x=(w-text_w)/2:y=h*0.17,drawbox=x=w*0.08:y=h*0.34:w=w*0.84:h=h*0.38:color=0x0b3148@0.88:t=fill,drawbox=x=w*0.08:y=h*0.34:w=w*0.84:h=h*0.38:color=0xd9b95b@0.95:t=4,drawtext=fontfile=${FONT}:text='설치 및 업데이트는':fontcolor=white:fontsize=h/24:x=(w-text_w)/2:y=h*0.41,drawtext=fontfile=${FONT}:text='공지사항에 있는 설치 동영상을':fontcolor=0xffe58a:fontsize=h/27:x=(w-text_w)/2:y=h*0.50,drawtext=fontfile=${FONT}:text='보시면서 진행하세요.':fontcolor=white:fontsize=h/24:x=(w-text_w)/2:y=h*0.59,drawtext=fontfile=${FONT}:text='항행의자유 V3':fontcolor=0xffe58a:fontsize=h/34:x=(w-text_w)/2:y=h*0.84[card];[main][card]concat=n=2:v=1:a=0[v]" -map '[v]' -map 0:a? -c:v libx264 -preset fast -crf 20 -c:a copy -shortest fixed.mp4
          mv fixed.mp4 freedom_onboarding_latest.mp4
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freedom_onboarding_latest.mp4
          git commit -m 'Fix onboarding final instruction screen' || exit 0
          git push
