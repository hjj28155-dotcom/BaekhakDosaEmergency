name: Build v1.0.84 MP4 My Files Only
on:
  push:
    paths:
      - '.github/workflows/build-v1082-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v1.0.82 source
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 'https://drive.usercontent.google.com/download?export=download&confirm=t&id=1WUyZKGiYVBNvX3N9xfSSsc7GUczpKb5u' -o /tmp/v1082.zip
          unzip -q /tmp/v1082.zip -d /tmp/v1082
          test -f /tmp/v1082/OVERLAY_ICON_V1057/app/build.gradle

      - name: MP4 only patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v1082/OVERLAY_ICON_V1057/app/src/main/java/com/baekhak/centralcontrol/LocalMediaPickerActivity.java')
          s=p.read_text()
          s=s.replace('private static final String MP4_RELATIVE_PATH = Environment.DIRECTORY_MOVIES + "/이동아이콘/MP4/";', 'private static final String MP4_APP_DIR = "moveicon_mp4_library";')
          start=s.index('    private Uri copyIntoMp4AppFolder(Uri source) throws IOException {')
          end=s.index('    private List<VideoItem> mp4AppFiles() {', start)
          methods='''    private File mp4AppFolder() throws IOException {
        File dir = new File(getFilesDir(), MP4_APP_DIR);
        if (!dir.isDirectory() && !dir.mkdirs()) throw new IOException("MP4 앱폴더를 만들지 못했습니다.");
        return dir;
    }

    private Uri copyIntoMp4AppFolder(Uri source) throws IOException {
        String name = null;
        try (Cursor c = getContentResolver().query(source, new String[]{android.provider.OpenableColumns.DISPLAY_NAME}, null, null, null)) {
            if (c != null && c.moveToFirst()) {
                int ix = c.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME);
                if (ix >= 0) name = c.getString(ix);
            }
        } catch (Exception ignored) {}
        if (name == null || name.trim().isEmpty()) name = "MP4_" + System.currentTimeMillis() + ".mp4";
        if (!name.toLowerCase(Locale.ROOT).endsWith(".mp4")) name += ".mp4";
        name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
        File outFile = new File(mp4AppFolder(), name);
        try (InputStream in = getContentResolver().openInputStream(source);
             OutputStream out = new FileOutputStream(outFile)) {
            if (in == null) throw new IOException("선택한 MP4를 읽지 못했습니다.");
            byte[] buf = new byte[1024 * 1024];
            long total=0; int n;
            while ((n=in.read(buf))!=-1) { out.write(buf,0,n); total+=n; }
            out.flush();
            if (total<=0) throw new IOException("빈 MP4 파일입니다.");
        } catch (Exception e) {
            outFile.delete();
            if (e instanceof IOException) throw (IOException)e;
            throw new IOException(e);
        }
        return Uri.fromFile(outFile);
    }

'''
          s=s[:start]+methods+s[end:]
          start=s.index('    private List<VideoItem> mp4AppFiles() {')
          end=s.index('    private void playSelectedUri(Uri uri) {', start)
          files='''    private List<VideoItem> mp4AppFiles() {
        List<VideoItem> out = new ArrayList<>();
        try {
            File[] all = mp4AppFolder().listFiles();
            if (all != null) {
                Arrays.sort(all, (a,b) -> a.getName().compareToIgnoreCase(b.getName()));
                for (File f : all) if (f.isFile() && f.length()>0 && f.getName().toLowerCase(Locale.ROOT).endsWith(".mp4"))
                    out.add(new VideoItem(Uri.fromFile(f), f.getName()));
            }
        } catch (Exception ignored) {}
        return out;
    }

'''
          s=s[:start]+files+s[end:]
          start=s.index('    private void openVideoPicker() {')
          end=s.index('    private void showMp4LibraryChooser', start)
          picker='''    private void openVideoPicker() {
        try {
            if ("MP4".equals(mode)) {
                try {
                    Intent samsung = new Intent("com.sec.android.app.myfiles.PICK_DATA");
                    samsung.putExtra("CONTENT_TYPE", "video/mp4");
                    samsung.addCategory(Intent.CATEGORY_DEFAULT);
                    samsung.putExtra(Intent.EXTRA_LOCAL_ONLY, true);
                    if (getPackageManager().resolveActivity(samsung, PackageManager.MATCH_DEFAULT_ONLY) != null) {
                        startActivityForResult(samsung, REQ_PICK_VIDEO);
                        return;
                    }
                } catch (Exception ignored) {}
            }
            Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
            i.addCategory(Intent.CATEGORY_OPENABLE);
            i.setType("AVI".equals(mode) ? "video/*" : "video/mp4");
            i.putExtra(Intent.EXTRA_LOCAL_ONLY, true);
            i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
            if ("MP4".equals(mode) && Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                Uri movies = Uri.parse("content://com.android.externalstorage.documents/document/primary%3AMovies");
                i.putExtra(DocumentsContract.EXTRA_INITIAL_URI, movies);
            }
            startActivityForResult(i, REQ_PICK_VIDEO);
        } catch (Exception e) {
            Toast.makeText(this, mode + " 불러오기 화면을 열지 못했습니다.", Toast.LENGTH_LONG).show();
        }
    }

'''
          s=s[:start]+picker+s[end:]
          p.write_text(s)
          bg=Path('/tmp/v1082/OVERLAY_ICON_V1057/app/build.gradle')
          b=bg.read_text().replace('versionCode 1082001','versionCode 1084001').replace('versionName "1.0.82-TEST-MP3-MP4-FLOW"','versionName "1.0.84-MP4-MYFILES-ONLY"')
          bg.write_text(b)
          PY

      - name: Build APK
        working-directory: /tmp/v1082/OVERLAY_ICON_V1057
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --no-build-cache
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" /tmp/Hanghae_MoveIcon_v1.0.84_TEST.apk

      - name: Verify upgrade compatibility with v1.0.82
        run: |
          set -euo pipefail
          curl -fL --retry 2 'https://github.com/hjj28155-dotcom/BaekhakDosaEmergency/releases/download/v1.0.82-test/Hanghae_MoveIcon_v1.0.82_TEST.apk' -o /tmp/old.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          OLD_PKG=$("$AAPT" dump badging /tmp/old.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          NEW_PKG=$("$AAPT" dump badging /tmp/Hanghae_MoveIcon_v1.0.84_TEST.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          OLD_CODE=$("$AAPT" dump badging /tmp/old.apk | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")
          NEW_CODE=$("$AAPT" dump badging /tmp/Hanghae_MoveIcon_v1.0.84_TEST.apk | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")
          OLD_CERT=$("$APKSIGNER" verify --print-certs /tmp/old.apk 2>&1 | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //')
          NEW_CERT=$("$APKSIGNER" verify --print-certs /tmp/Hanghae_MoveIcon_v1.0.84_TEST.apk 2>&1 | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //')
          test "$OLD_PKG" = "$NEW_PKG"
          test "$OLD_CERT" = "$NEW_CERT"
          test "$NEW_CODE" -gt "$OLD_CODE"
          echo UPGRADE_COMPATIBILITY=PASS

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v1.0.84-test --yes --cleanup-tag || true
          gh release create v1.0.84-test /tmp/Hanghae_MoveIcon_v1.0.84_TEST.apk#항행의자유 이동아이콘 v1.0.84 TEST APK --target main --title "항행의자유 이동아이콘 v1.0.84" --notes "MP4만 수정했습니다. 앱 내부 MP4 폴더와 삼성 내 파일 불러오기만 수정했습니다."
